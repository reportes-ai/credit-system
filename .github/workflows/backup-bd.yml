# ─────────────────────────────────────────────────────────────────
# Respaldo nocturno de la BD (TiDB Cloud) — complementa el backup
# automático de TiDB Starter, cuya retención es de SOLO 1 día.
# Cada noche hace mysqldump completo y lo guarda en DOS lugares:
#   1) artefacto privado del repo (30 días de retención)
#   2) bucket privado de Google Cloud Storage (gs://autofacil-respaldos-bd,
#      90 días por la regla de ciclo de vida del bucket) — tercera copia,
#      fuera de GitHub y de TiDB. Requiere los secrets GCP_SA_KEY y GCS_BUCKET.
#
# OJO: el mysqldump YA NO CONTIENE LOS DOCUMENTOS. Desde el 05-08-2026 los
# archivos viven en gs://autofacil-docs y no en la base, así que su respaldo es
# un paso aparte al final de este mismo workflow (bucket → bucket, sin regla de
# borrado en el destino). Ver docs/ALMACEN-documentos.md.
#
# Restauración:  descargar el artefacto → descomprimir →
#   mysql -h <DB_HOST> -P 4000 -u <DB_USER> -p --ssl-mode=VERIFY_IDENTITY <DB_NAME> < backup.sql
# (restaurar en un cluster/branch nuevo primero; NUNCA directo a prod sin revisar)
# ─────────────────────────────────────────────────────────────────
name: Backup BD nocturno

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC = 02:17 Chile (verano) — fuera de horario
  workflow_dispatch: {}     # también se puede lanzar a mano (pestaña Actions)

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Instalar cliente MySQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Dump completo
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mysqldump -h "$DB_HOST" -P "${DB_PORT:-4000}" -u "$DB_USER" -p"$DB_PASSWORD" \
            --ssl-mode=REQUIRED --skip-lock-tables --quick --no-tablespaces \
            --set-gtid-purged=OFF --column-statistics=0 \
            "$DB_NAME" | gzip -9 > backup-$(date +%Y%m%d).sql.gz
          ls -lh backup-*.sql.gz
          # Sanidad: el dump debe terminar completo
          gunzip -t backup-*.sql.gz
          zcat backup-*.sql.gz | tail -1 | grep -q "Dump completed" && echo "✓ dump completo"

      - name: Guardar artefacto (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-bd-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 30
          compression-level: 0

      # ── Tercera copia: Google Cloud Storage (bucket privado, 90 días de retención
      #    por regla de ciclo de vida del bucket). Si el secret no está, se omite. ──
      - name: Subir a Google Cloud Storage
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY no configurado — se omite la copia a Google Cloud Storage"; exit 0
          fi
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp-sa.json
          # gcloud/gsutil ya vienen instalados en ubuntu-latest
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa.json --quiet
          gsutil cp backup-*.sql.gz "gs://${GCS_BUCKET}/"
          rm -f /tmp/gcp-sa.json
          echo "✓ dump subido a gs://${GCS_BUCKET}/"

      # ── Respaldo de los DOCUMENTOS (bucket → bucket) ────────────────────────
      # Desde que los archivos salieron de la base (ver docs/ALMACEN-documentos.md)
      # el mysqldump de arriba YA NO LOS CONTIENE. Sin este paso los documentos
      # quedarían con una sola copia: el versionado de gs://autofacil-docs protege
      # contra un borrado por error, no contra perder el bucket.
      #
      # DOS COSAS QUE NO SE PUEDEN CAMBIAR:
      #  1. Destino PROPIO, no el bucket de dumps: ese tiene ciclo de vida de 90
      #     días, y un documento que lleve tres meses sin cambiar sería borrado
      #     por la regla — rsync no lo repondría, porque en el origen no cambió
      #     nada. El destino de documentos NO lleva regla de borrado.
      #  2. rsync SIN `-d`: con esa bandera el destino imita al origen, borrados
      #     incluidos. Un respaldo que replica borrados no es un respaldo.
      - name: Respaldar los documentos (bucket → bucket)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # Nombres de bucket, no secretos: van acá a la vista. El único secreto
          # real es la llave de la cuenta de servicio.
          GCS_DOCS: autofacil-docs
          GCS_DOCS_RESPALDO: autofacil-docs-respaldo
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Sin GCP_SA_KEY — se omite el respaldo de documentos"; exit 0
          fi
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp-sa.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa.json --quiet
          gsutil -m rsync -r "gs://${GCS_DOCS}" "gs://${GCS_DOCS_RESPALDO}/"
          rm -f /tmp/gcp-sa.json
          # Conteo de control: si el respaldo tiene MENOS archivos que el origen,
          # algo se perdió en el camino y hay que mirarlo — no se falla el job,
          # pero queda gritado en el log.
          ORIG=$(gsutil ls -r "gs://${GCS_DOCS}/**" 2>/dev/null | wc -l)
          COPIA=$(gsutil ls -r "gs://${GCS_DOCS_RESPALDO}/**" 2>/dev/null | wc -l)
          echo "documentos: origen=$ORIG respaldo=$COPIA"
          [ "$COPIA" -ge "$ORIG" ] && echo "✓ respaldo completo" || echo "⚠ el respaldo tiene MENOS archivos que el origen — revisar"
