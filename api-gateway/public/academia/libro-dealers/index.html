<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libro: Creación de Dealers — Academia AutoFácil</title>
  <!-- v2.0 — el manual REAL hoja por hoja: 21 páginas del Word v1.1 rasterizadas (pages/pg-NN.jpg), libro a pantalla completa. v1.0 — resumen en HTML -->
  <link href="/css/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --navy:#0b2447; --blue:#0141A2; --blue2:#0d6efd; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(160deg,#0b2447 0%,#123a75 60%,#0b2447 100%); overflow:hidden; display:flex; flex-direction:column; }

    .escena { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; padding:10px 10px 0; }

    /* ── Libro ── */
    .libro-wrap { perspective:3000px; }
    .libro { position:relative; transform-style:preserve-3d; }
    .cara-fija { position:absolute; top:0; width:50%; height:100%; background:#fff; }
    .cara-fija.izq { left:0; border-radius:8px 2px 2px 8px; box-shadow:-8px 10px 30px rgba(0,0,0,.5); }
    .cara-fija.der { right:0; border-radius:2px 8px 8px 2px; box-shadow:8px 10px 30px rgba(0,0,0,.5); }
    .hoja { position:absolute; top:0; right:0; width:50%; height:100%; transform-style:preserve-3d; transform-origin:left center; transition:transform .85s cubic-bezier(.35,.1,.25,1); cursor:pointer; }
    .hoja.girada { transform:rotateY(-180deg); }
    .cara { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:#fff; overflow:hidden; }
    .cara.frente { border-radius:2px 8px 8px 2px; }
    .cara.dorso { transform:rotateY(180deg); border-radius:8px 2px 2px 8px; }
    .cara img { width:100%; height:100%; display:block; object-fit:contain; background:#fff; user-select:none; -webkit-user-drag:none; }
    .cara.frente::after { content:''; position:absolute; left:0; top:0; bottom:0; width:30px; background:linear-gradient(90deg,rgba(0,0,0,.12),transparent); pointer-events:none; }
    .cara.dorso::after  { content:''; position:absolute; right:0; top:0; bottom:0; width:30px; background:linear-gradient(-90deg,rgba(0,0,0,.12),transparent); pointer-events:none; }

    /* contraportada (última cara, sin imagen) */
    .contra { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:linear-gradient(150deg,#0141A2,#0b2447); color:#fff; padding:8%; }
    .contra .marco { border:2px solid rgba(255,255,255,.28); border-radius:14px; padding:2em 1.8em; }
    .contra h2 { font-size:1.5em; margin:.5em 0; }
    .contra .v { font-size:.75em; opacity:.6; margin-top:1.4em; }

    /* ── Controles ── */
    .controles { flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 0 12px; }
    .controles .titulo { color:#fff; font-weight:700; font-size:.92rem; display:flex; align-items:center; gap:8px; margin-right:14px; }
    .cbtn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:10px; padding:8px 18px; font-weight:700; font-size:.88rem; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:background .15s; }
    .cbtn:hover:not(:disabled) { background:rgba(255,255,255,.22); }
    .cbtn:disabled { opacity:.35; cursor:default; }
    .indicador { color:rgba(255,255,255,.65); font-size:.82rem; min-width:130px; text-align:center; }
    .tip { color:rgba(255,255,255,.35); font-size:.73rem; margin-left:10px; }
    @media (max-width:900px){ .tip{ display:none; } .controles .titulo span{ display:none; } }
  </style>
</head>
<body>
<script>window.AF_TOPNAV = { breadcrumb: [
  { label:'Inicio', href:'/' },
  { label:'Academia', href:'/academia/' },
  { label:'Libro: Creación de Dealers', icon:'bi-book-half', current:true }
] };</script>
<script src="/js/topnav.js"></script>

<div class="escena">
  <div class="libro-wrap">
    <div class="libro" id="libro">
      <div class="cara-fija izq" id="baseIzq"></div>
      <div class="cara-fija der" id="baseDer"></div>
    </div>
  </div>
</div>

<div class="controles">
  <div class="titulo"><i class="bi bi-book-half"></i><span>Creación de Dealers — Manual v1.1</span></div>
  <button class="cbtn" id="bAtras" onclick="voltear(-1)"><i class="bi bi-chevron-left"></i> Anterior</button>
  <div class="indicador" id="indicador">—</div>
  <button class="cbtn" id="bSig" onclick="voltear(1)">Siguiente <i class="bi bi-chevron-right"></i></button>
  <div class="tip">Clic en la página o flechas ← → para dar vuelta la hoja</div>
</div>

<script src="/js/app-version.js"></script>
<script>
const token = sessionStorage.getItem('token');
if (!token) location.href = '/login.html';

/* ── Las hojas reales del manual (Word v1.1 → imagen por página) ── */
const N_IMGS = 21;                                  // pages/pg-01.jpg … pg-21.jpg
const RATIO = 1105 / 1430;                          // ancho/alto de cada página
const src = n => `/academia/libro-dealers/pages/pg-${String(n).padStart(2,'0')}.jpg`;

const CONTRA = `<div class="contra"><div class="marco">
  <i class="bi bi-patch-check-fill" style="font-size:2.4em;color:#61a8ff"></i>
  <h2>Fin del manual</h2>
  <div style="font-size:.85em;opacity:.85;line-height:1.6">Ante cualquier duda, usa el botón <b>«?»</b><br>del módulo Creación/Mantenedor de Dealer<br>o consulta Documentación.</div>
  <div class="v">Academia AutoFácil · Manual v1.1 · Agosto 2026</div>
</div></div>`;

/* páginas: 21 imágenes + contraportada (para cerrar la última hoja) */
const PAGINAS = [];
for (let n = 1; n <= N_IMGS; n++) PAGINAS.push(`<img src="${src(n)}" alt="Página ${n}" loading="eager" draggable="false">`);
if (PAGINAS.length % 2) PAGINAS.push(CONTRA);

const libro = document.getElementById('libro');
const N_HOJAS = PAGINAS.length / 2;
let VOLTEADAS = 0;

for (let i = 0; i < N_HOJAS; i++) {
  const h = document.createElement('div');
  h.className = 'hoja';
  h.dataset.i = i;
  h.innerHTML = `<div class="cara frente">${PAGINAS[2*i]}</div><div class="cara dorso">${PAGINAS[2*i+1]}</div>`;
  h.addEventListener('click', () => { (Number(h.dataset.i) < VOLTEADAS) ? voltear(-1) : voltear(1); });
  libro.appendChild(h);
}
const HOJAS = [...libro.querySelectorAll('.hoja')];

function pintar() {
  HOJAS.forEach((h, i) => {
    h.classList.toggle('girada', i < VOLTEADAS);
    h.style.zIndex = (i < VOLTEADAS) ? (i + 1) : (N_HOJAS - i);
  });
  document.getElementById('baseIzq').style.display = VOLTEADAS > 0 ? 'block' : 'none';
  document.getElementById('baseDer').style.display = VOLTEADAS < N_HOJAS ? 'block' : 'none';
  document.getElementById('bAtras').disabled = VOLTEADAS === 0;
  document.getElementById('bSig').disabled = VOLTEADAS === N_HOJAS;
  const ind = document.getElementById('indicador');
  if (VOLTEADAS === 0) ind.textContent = 'Portada';
  else if (VOLTEADAS === N_HOJAS) ind.textContent = 'Fin del libro';
  else ind.textContent = `Páginas ${2*VOLTEADAS} – ${2*VOLTEADAS+1} de ${N_IMGS}`;
}

function voltear(dir) {
  const n = VOLTEADAS + dir;
  if (n < 0 || n > N_HOJAS) return;
  VOLTEADAS = n;
  pintar();
}

/* ── Tamaño: ocupar toda la pantalla disponible ── */
function ajustar() {
  const escena = document.querySelector('.escena');
  const altoDisp = escena.clientHeight - 8;
  const anchoDisp = escena.clientWidth - 8;
  // el libro abierto son 2 páginas lado a lado
  let alto = altoDisp;
  let ancho = alto * RATIO * 2;
  if (ancho > anchoDisp) { ancho = anchoDisp; alto = ancho / (RATIO * 2); }
  const l = document.getElementById('libro');
  l.style.width = ancho + 'px';
  l.style.height = alto + 'px';
}
window.addEventListener('resize', ajustar);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') voltear(1);
  else if (e.key === 'ArrowLeft') voltear(-1);
});

ajustar();
pintar();
/* precarga silenciosa de todas las hojas */
for (let n = 1; n <= N_IMGS; n++) { const im = new Image(); im.src = src(n); }
</script>
</body>
</html>
