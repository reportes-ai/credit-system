<!DOCTYPE html>
<!-- v1.0 — PWA Clave Gerencia: códigos de aprobación GERENCIA para Cartas -->
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0050">
<title>Clave Gerencia — AutoFácil</title>
<link rel="manifest" href="/clave-gerencia/manifest.json">
<link rel="apple-touch-icon" href="/clave-gerencia/apple-touch-icon.png">
<link rel="icon" href="/clave-gerencia/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Paleta Solo Dios: morado profundo → violeta → dorado */
  :root { --dios1:#1a0050; --dios2:#6d28d9; --dios3:#f59e0b; --bg:#f3f0fa; --line:#e2dcf0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:#1f2937;
         padding-bottom:env(safe-area-inset-bottom); }

  /* ── Login ── */
  #loginView { position:fixed; inset:0; background:linear-gradient(160deg,var(--dios1),var(--dios2) 55%,var(--dios3));
               display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; z-index:1000; }
  #loginView img { height:52px; filter:brightness(0) invert(1); margin-bottom:10px; }
  #loginView .sub { color:rgba(255,255,255,.9); font-size:.8rem; font-weight:700; letter-spacing:2px;
                    text-transform:uppercase; margin-bottom:30px; }
  #loginView input { width:100%; max-width:340px; border:none; border-radius:12px; padding:14px 16px; font-size:1rem; margin-bottom:12px; }
  #loginView button { width:100%; max-width:340px; border:none; border-radius:12px; padding:14px; font-size:1rem;
                      font-weight:700; background:#fff; color:var(--dios1); cursor:pointer; }
  #loginErr { color:#fecaca; font-size:.85rem; min-height:22px; margin-top:10px; font-weight:600; text-align:center; }

  /* ── Cabecera ── */
  header { background:linear-gradient(135deg,var(--dios1),var(--dios2) 60%,var(--dios3)); color:#fff; padding:14px 16px;
           padding-top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px;
           position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  header .t { font-weight:800; font-size:1.05rem; line-height:1.15; }
  header .u { font-size:.72rem; opacity:.85; }
  header button { margin-left:auto; background:rgba(255,255,255,.18); border:none; color:#fff;
                  border-radius:9px; padding:8px 10px; font-size:.9rem; }

  .wrap { max-width:560px; margin:0 auto; padding:14px 14px 40px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 8px rgba(26,0,80,.09); margin-bottom:14px; overflow:hidden; }
  .card > h2 { margin:0; background:var(--dios1); color:#fff; font-size:.82rem; font-weight:700;
               letter-spacing:.5px; padding:11px 14px; display:flex; align-items:center; gap:8px; }
  .card .body { padding:14px; }

  label { display:block; font-size:.68rem; font-weight:700; color:#6b21a8; letter-spacing:.6px;
          text-transform:uppercase; margin-bottom:5px; }
  label .aux { color:var(--dios3); text-transform:none; letter-spacing:0; }
  input[type=text], input[type=number], input[type=email], input[type=password], textarea, select {
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 13px; font-size:1.05rem;
    font-weight:600; color:#0f172a; background:#faf8ff; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--dios2); background:#fff; }
  textarea { font-size:.95rem; font-weight:500; resize:vertical; min-height:74px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .fld { margin-bottom:13px; }

  .btn-gen { width:100%; border:none; border-radius:12px; padding:15px; font-size:1.05rem; font-weight:800;
             letter-spacing:.5px; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;
             background:linear-gradient(135deg,var(--dios2),var(--dios3)); box-shadow:0 4px 14px rgba(109,40,217,.35); }
  .btn-gen:active { filter:brightness(.92); }
  .btn-gen:disabled { opacity:.55; }

  /* ── Código generado ── */
  #resultado { display:none; border-radius:16px; padding:24px 18px; text-align:center; color:#fff; margin-bottom:14px;
               background:linear-gradient(135deg,var(--dios1),var(--dios2) 55%,var(--dios3));
               box-shadow:0 6px 22px rgba(26,0,80,.35); }
  #resultado .lbl { font-size:.7rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.85; }
  #resultado .cod { font-size:3rem; font-weight:900; letter-spacing:8px; margin:8px 0 4px; font-variant-numeric:tabular-nums;
                    text-shadow:0 2px 8px rgba(0,0,0,.3); }
  #resultado .det { font-size:.85rem; font-weight:600; opacity:.95; margin-bottom:14px; }
  #resultado button { border:none; border-radius:10px; padding:11px 22px; font-size:.9rem; font-weight:700;
                      background:rgba(255,255,255,.92); color:var(--dios1); cursor:pointer; }

  #errBox { display:none; background:#fee2e2; border-left:4px solid #dc2626; color:#7f1d1d; border-radius:9px;
            padding:11px 13px; font-size:.85rem; font-weight:600; margin-bottom:14px; }

  /* ── Historial ── */
  .hitem { border-bottom:1px solid #f1edfa; padding:10px 2px; display:flex; align-items:center; gap:10px; }
  .hitem:last-child { border-bottom:none; }
  .hitem .cod { font-weight:800; font-size:1.05rem; letter-spacing:2px; color:var(--dios1); font-variant-numeric:tabular-nums; }
  .hitem .inf { flex:1; font-size:.76rem; color:#6b7280; line-height:1.45; }
  .hitem .inf b { color:#374151; }
  .badge { font-size:.66rem; font-weight:800; letter-spacing:.5px; border-radius:8px; padding:3px 9px; }
  .b-vig { background:#ede9fe; color:#6d28d9; }
  .b-usa { background:#d1fae5; color:#065f46; }
  .b-ven { background:#f3f4f6; color:#6b7280; }
  .mini { font-size:.74rem; color:#6b7280; line-height:1.5; }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(80px); background:#1a0050;
           color:#fff; padding:11px 18px; border-radius:24px; font-size:.85rem; font-weight:600; opacity:0;
           transition:.25s; z-index:900; max-width:90vw; text-align:center; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="loginView" style="display:none;">
  <img src="/img/logo.png" alt="AutoFácil" onerror="this.style.display='none'">
  <div class="sub">⚡ Clave Gerencia</div>
  <input id="liEmail" type="email" placeholder="Correo" autocomplete="username" inputmode="email">
  <input id="liClave" type="password" placeholder="Contraseña" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Entrar</button>
  <div id="loginErr"></div>
</div>

<div id="appView" style="display:none;">
  <header>
    <div>
      <div class="t"><i class="bi bi-key-fill"></i> Clave Gerencia</div>
      <div class="u" id="uNombre">—</div>
    </div>
    <button onclick="logout()" title="Salir"><i class="bi bi-box-arrow-right"></i></button>
  </header>

  <div class="wrap">
    <div id="resultado">
      <div class="lbl">Código de Gerencia</div>
      <div class="cod" id="rCod">—</div>
      <div class="det" id="rDet">—</div>
      <button onclick="copiarCodigo()"><i class="bi bi-clipboard-check"></i> Copiar código</button>
    </div>

    <div id="errBox"></div>

    <div class="card">
      <h2><i class="bi bi-pencil-square"></i> DATOS DE LA OPERACIÓN</h2>
      <div class="body">
        <div class="fld"><label>RUT del cliente</label>
          <input id="iRut" type="text" inputmode="text" placeholder="12.345.678-9" oninput="fmtRut(this)"></div>
        <div class="row2">
          <div class="fld"><label>Saldo precio $</label>
            <input id="iSaldo" type="text" inputmode="numeric" oninput="fmtMiles(this)"></div>
          <div class="fld"><label>Plazo <span class="aux">(opcional)</span></label>
            <input id="iPlazo" type="number" inputmode="numeric" min="1" max="72" placeholder="cuotas"></div>
        </div>
        <div class="fld"><label>Ejecutivo de la carta</label>
          <input id="iEjec" type="text" list="dlEjec" placeholder="Nombre del ejecutivo">
          <datalist id="dlEjec"></datalist></div>
        <div class="fld"><label>Motivo <span class="aux">(obligatorio, queda en auditoría)</span></label>
          <textarea id="iMotivo" placeholder="Por qué la Gerencia autoriza esta excepción (mínimo 10 caracteres)"></textarea></div>
        <button class="btn-gen" id="btnGen" onclick="generar()">
          <i class="bi bi-key-fill"></i> GENERAR CÓDIGO</button>
        <p class="mini" style="margin:11px 0 0" id="notaVig">El código vence según la vigencia configurada en el
          mantenedor de Excepciones Comerciales y sirve para UNA sola carta.</p>
      </div>
    </div>

    <div class="card">
      <h2><i class="bi bi-clock-history"></i> ÚLTIMOS CÓDIGOS DE GERENCIA</h2>
      <div class="body" id="hist"><p class="mini">Cargando…</p></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CLAVE GERENCIA — PWA para generar códigos de aprobación de GERENCIA que
   destraban una Carta de Aprobación bajo el piso de rentabilidad.

   No calcula nada: el código nace en el servidor (POST /api/excepciones/
   generar-gerencia, protegido por requireFunc('excepciones_gerencia')) y el
   Revisor/formulario de Cartas lo valida y consume por el motor único.
   ═══════════════════════════════════════════════════════════════════════════ */
const API = '/api';
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('token');
let ULTIMO = '';

const H = (json) => Object.assign({ 'Authorization': 'Bearer ' + TOKEN },
  json ? { 'Content-Type': 'application/json' } : {});
const fN = n => Math.round(n).toLocaleString('es-CL');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/clave-gerencia/sw.js').catch(()=>{});

/* ── Boot ── */
(async function boot(){
  if (!TOKEN) return mostrarLogin();
  try {
    const r = await fetch(API + '/auth/mis-permisos', { headers: H() });
    if (r.status === 401 || r.status === 403) return mostrarLogin();
    const j = await r.json();
    const u = (j.data && j.data.usuario) || j.usuario || {};
    $('uNombre').textContent = u.nombre ? (u.nombre + ' ' + (u.apellido || '')).trim() : '—';
  } catch (e) { return mostrarLogin(); }
  $('appView').style.display = '';
  cargarEjecutivos();
  cargarHistorial();
})();

function mostrarLogin(){ $('loginView').style.display=''; $('appView').style.display='none'; }
async function doLogin(){
  $('loginErr').textContent = '';
  try {
    const r = await fetch(API + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: $('liEmail').value.trim(), password: $('liClave').value }) });
    const j = await r.json();
    if (!j.success) { $('loginErr').textContent = j.error || 'Credenciales inválidas'; return; }
    TOKEN = j.data.token;
    localStorage.setItem('token', TOKEN);
    const u = j.data.usuario || {};
    $('uNombre').textContent = ((u.nombre||'') + ' ' + (u.apellido||'')).trim() || '—';
    $('loginView').style.display = 'none';
    $('appView').style.display = '';
    cargarEjecutivos();
    cargarHistorial();
  } catch (e) { $('loginErr').textContent = 'Sin conexión al servidor'; }
}
function logout(){ localStorage.removeItem('token'); location.reload(); }

/* ── Selector de ejecutivos (misma lista de los selectores de Cartas) ── */
async function cargarEjecutivos(){
  try {
    const r = await fetch(API + '/cartas-ejecutivos', { headers: H() });
    const j = await r.json();
    if (j.success && Array.isArray(j.data))
      $('dlEjec').innerHTML = j.data.map(e => `<option value="${e.nombre}">`).join('');
  } catch (e) { /* sin lista: se escribe a mano */ }
}

/* ── Inputs ── */
function fmtMiles(inp){
  const raw = inp.value.replace(/[^0-9]/g,'');
  inp.value = raw ? '$' + parseInt(raw,10).toLocaleString('es-CL') : '';
}
const parseMiles = s => parseInt((s||'').replace(/[^0-9]/g,''),10) || 0;
function fmtRut(inp){
  let v = inp.value.replace(/[^0-9kK]/g,'').toUpperCase();
  if (v.length > 1) {
    const dv = v.slice(-1), num = v.slice(0,-1);
    inp.value = num.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + '-' + dv;
  } else inp.value = v;
}

/* ── Generar ── */
async function generar(){
  $('errBox').style.display = 'none';
  const rut    = $('iRut').value.trim();
  const saldo  = parseMiles($('iSaldo').value);
  const plazo  = parseInt($('iPlazo').value) || null;
  const ejec   = $('iEjec').value.trim();
  const motivo = $('iMotivo').value.trim();
  if (rut.replace(/[^0-9]/g,'').length < 7) return err('Falta el RUT del cliente.');
  if (!(saldo > 0))                          return err('Falta el saldo precio.');
  if (motivo.length < 10)                    return err('El motivo es obligatorio (mínimo 10 caracteres).');

  $('btnGen').disabled = true;
  try {
    const r = await fetch(API + '/excepciones/generar-gerencia', { method:'POST', headers:H(true),
      body: JSON.stringify({ rut_cliente: rut, saldo_precio: saldo, plazo, ejecutivo: ejec || undefined, comentario: motivo }) });
    const j = await r.json();
    if (!j.success) return err(j.error || 'No se pudo generar el código.');
    ULTIMO = j.data.codigo;
    $('rCod').textContent = ULTIMO;
    $('rDet').textContent = `${ejec || 'Cualquier ejecutivo'} · RUT ${rut} · saldo $${fN(saldo)}` + (plazo ? ` · ${plazo} cuotas` : '');
    $('resultado').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    copiarCodigo(true);
    cargarHistorial();
  } catch (e) { err('Sin conexión al servidor — el código se genera en el servidor, necesitas señal.'); }
  finally { $('btnGen').disabled = false; }
}
function err(m){ const b=$('errBox'); b.textContent=m; b.style.display=''; }

async function copiarCodigo(silencio){
  if (!ULTIMO) return;
  try { await navigator.clipboard.writeText(ULTIMO); toast('Código ' + ULTIMO + ' copiado'); }
  catch (e) { if (!silencio) toast('No se pudo copiar — anótalo: ' + ULTIMO); }
}

/* ── Historial: solo los GERENCIA del registro ── */
async function cargarHistorial(){
  try {
    const r = await fetch(API + '/excepciones/registro', { headers: H() });
    const j = await r.json();
    if (!j.success || !Array.isArray(j.data)) throw 0;
    const rows = j.data.filter(x => x.tipo === 'GERENCIA').slice(0, 15);
    if (!rows.length) { $('hist').innerHTML = '<p class="mini">Aún no se han generado códigos de Gerencia.</p>'; return; }
    const B = { VIGENTE:'b-vig', USADO:'b-usa', VENCIDO:'b-ven' };
    $('hist').innerHTML = rows.map(x => {
      const f = x.generado_at ? new Date(x.generado_at) : null;
      const ff = f ? f.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}) + ' ' +
                     f.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
      return `<div class="hitem">
        <div class="cod">${x.codigo}</div>
        <div class="inf"><b>${x.ejecutivo || '—'}</b> · RUT ${x.rut_cliente || '—'} · $${fN(Number(x.saldo_precio)||0)}<br>
          ${ff}${x.usado_carta ? ' · carta ' + x.usado_carta : ''}</div>
        <span class="badge ${B[x.estado]||'b-ven'}">${x.estado}</span>
      </div>`;
    }).join('');
  } catch (e) { $('hist').innerHTML = '<p class="mini">No se pudo cargar el historial.</p>'; }
}
</script>
</body>
</html>
