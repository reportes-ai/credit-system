<!DOCTYPE html>
<!-- v2.7 — gauge del presupuesto: proyeccion en tono claro y brecha al presupuesto en rojo · v2.6 — hoy muestra real + meta del dia (borde destacado) · v2.5 — restauracion tras truncado + carrera por operaciones por defecto · v2.3 — mes contra mes (a igual dia) bajo el año contra año · v2.2 — heatmap con Q requerido para la proyeccion (solo dias futuros), layout rebalanceado (mix+embudo apilados, YoY arriba, records junto a podios) · v2.1 — Q esperado en el heatmap (peso por dia de semana), radiografia del mes, año contra año, salon de records, pantalla completa · v2.0 — rediseño completo: curva acumulada del mes vs mes anterior vs ritmo presupuesto, heatmap de dias, donut institucion, gauge presupuesto, sparklines por KPI, podio con medallas · v1.0 — primera version -->
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen Ejecutivo — AutoFácil</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link href="/css/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --bg:#070c16; --panel:rgba(17,26,46,.75); --line:#1c2a47; --tx:#eaf1fb; --mut:#7e93b8;
          --accent:#00a6ff; --accent2:#37d0ff; --ok:#2fe6a7; --bad:#ff6b7a; --gold:#ffc53d; --violet:#a78bfa; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--tx); font-family:'Segoe UI',system-ui,sans-serif;
         background:radial-gradient(1200px 600px at 75% -10%, #0d2247 0%, transparent 60%),
                    radial-gradient(900px 500px at -10% 30%, #101c38 0%, transparent 55%), var(--bg); min-height:100vh; }
  .main { max-width:1780px; margin:0 auto; padding:22px 28px 80px; }
  .fade { opacity:0; transform:translateY(10px); animation:up .5s forwards; }
  @keyframes up { to { opacity:1; transform:none; } }
  .head { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .head h1 { margin:0; font-size:1.45rem; font-weight:800; letter-spacing:.01em; }
  .head h1 span { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .head select { background:#0d1730; color:var(--tx); border:1.5px solid var(--line); border-radius:11px; padding:8px 14px; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }
  .sub { color:var(--mut); font-size:.78rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px;
          backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  h3.t { margin:0 0 4px; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); font-weight:800; display:flex; align-items:center; gap:8px; }
  h3.t i { color:var(--accent); font-size:.9rem; }
  h3.t .r { margin-left:auto; display:flex; gap:6px; }
  .grid { display:grid; gap:16px; }
  .kpis { grid-template-columns:repeat(4,1fr); margin-bottom:16px; }
  @media (max-width:1080px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi { position:relative; overflow:hidden; }
  .kpi .lbl { color:var(--mut); font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; font-weight:800; }
  .kpi .val { font-size:2rem; font-weight:850; margin:8px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .kpi .val small { font-size:.95rem; color:var(--mut); font-weight:700; }
  .kpi .spark { position:absolute; right:12px; bottom:10px; opacity:.9; }
  .delta { font-weight:800; border-radius:20px; padding:2px 9px; font-size:.7rem; display:inline-flex; align-items:center; gap:4px; }
  .up { color:#062b1e; background:var(--ok); } .down { color:#3d060d; background:var(--bad); } .flat { color:#0b1220; background:#8fa3c0; }
  .cmp { font-size:.72rem; color:var(--mut); margin-top:2px; }
  .row-main { grid-template-columns:1.6fr 1fr; margin-bottom:16px; }
  .row-3 { grid-template-columns:1.05fr 1fr 1.25fr; margin-bottom:16px; }
  .row-2 { grid-template-columns:1fr 1fr; }
  @media (max-width:1080px){ .row-main,.row-3,.row-2{ grid-template-columns:1fr; } }
  .tog { border:1px solid var(--line); background:#0d1730; color:var(--mut); font-size:.68rem; font-weight:800; border-radius:8px; padding:4px 10px; cursor:pointer; letter-spacing:.05em; }
  .tog.on { color:#04121f; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-color:transparent; }
  .leg { display:flex; gap:16px; flex-wrap:wrap; font-size:.72rem; color:var(--mut); margin-top:10px; }
  .dash { display:inline-block; width:16px; height:0; border-top:2.5px solid; margin-right:6px; vertical-align:middle; border-radius:2px; }
  .gaugewrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .gnum { font-size:2.1rem; font-weight:850; margin-top:-58px; font-variant-numeric:tabular-nums; }
  .glbl { color:var(--mut); font-size:.72rem; margin-bottom:10px; }
  .gleg { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:.68rem; color:var(--mut); margin:-4px 0 12px; }
  .gleg .gsw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .gdet { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:.78rem; }
  .gdet .b { background:#0d1730; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .gdet .b .k { color:var(--mut); font-size:.64rem; text-transform:uppercase; letter-spacing:.08em; font-weight:800; }
  .gdet .b .v { font-weight:800; font-size:.98rem; margin-top:3px; font-variant-numeric:tabular-nums; }
  .proy { margin-top:12px; width:100%; padding:11px 14px; border-radius:12px; font-size:.8rem; line-height:1.55;
          background:linear-gradient(90deg, rgba(255,197,61,.12), transparent); border:1px solid rgba(255,197,61,.35); }
  .heat { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }
  .hd { text-align:center; font-size:.62rem; color:var(--mut); font-weight:800; }
  .hc { aspect-ratio:1.35; border-radius:7px; background:#0d1730; border:1px solid #14203a; position:relative; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; color:var(--mut); }
  .hc .q { position:absolute; top:2px; right:5px; font-size:.58rem; opacity:.85; }
  .hc .e { position:absolute; bottom:2px; left:5px; font-size:.56rem; color:var(--gold); font-weight:800; opacity:.9; }
  .donutwrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .dleg { display:flex; flex-direction:column; gap:10px; font-size:.78rem; flex:1; min-width:150px; }
  .dleg .it { display:flex; align-items:center; gap:9px; }
  .dleg .sw { width:11px; height:11px; border-radius:4px; flex:none; }
  .dleg b { font-variant-numeric:tabular-nums; }
  .dleg small { color:var(--mut); display:block; font-size:.68rem; }
  .fun { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .fs { position:relative; height:44px; border-radius:11px; overflow:hidden; background:#0d1730; border:1px solid var(--line); }
  .fs .fill { position:absolute; inset:0; border-radius:11px; }
  .fs .in { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:.82rem; font-weight:800; }
  .fs .in small { font-weight:600; color:rgba(255,255,255,.75); font-size:.68rem; margin-left:8px; }
  .conv { text-align:right; color:var(--mut); font-size:.68rem; padding-right:6px; }
  .podio { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .p-it { display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; }
  .ava { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:850; color:#04121f; }
  .m1 { background:linear-gradient(135deg,#ffe28a,var(--gold)); box-shadow:0 0 14px rgba(255,197,61,.4); }
  .m2 { background:linear-gradient(135deg,#e8eef7,#9fb3cc); } .m3 { background:linear-gradient(135deg,#f3b58c,#c77b46); }
  .mn { background:#1a2a4a; color:var(--mut); }
  .p-nm { font-size:.84rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p-bar { height:6px; border-radius:4px; background:#0d1730; margin-top:5px; overflow:hidden; }
  .p-bar > div { height:100%; border-radius:4px; background:linear-gradient(90deg,#0a4d8c,var(--accent),var(--accent2)); }
  .p-v { text-align:right; font-weight:800; font-size:.84rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .p-v small { display:block; color:var(--mut); font-weight:500; font-size:.66rem; }
  .strip { grid-template-columns:repeat(6,1fr); margin-bottom:16px; }
  @media (max-width:1200px){ .strip{ grid-template-columns:repeat(3,1fr);} }
  @media (max-width:700px){ .strip{ grid-template-columns:repeat(2,1fr);} }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:13px 15px; }
  .tile .k { color:var(--mut); font-size:.62rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; display:flex; gap:6px; align-items:center; }
  .tile .k i { color:var(--accent); }
  .tile .v { font-size:1.25rem; font-weight:850; margin-top:6px; font-variant-numeric:tabular-nums; }
  .tile .d { color:var(--mut); font-size:.66rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .yoy { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .yy { display:grid; grid-template-columns:1fr auto auto auto; gap:10px; align-items:center; background:#0d1730; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:.8rem; }
  .yy .k { color:var(--mut); font-weight:700; }
  .yy b { font-variant-numeric:tabular-nums; }
  .rec { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .rc { display:flex; gap:12px; align-items:center; background:#0d1730; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:.8rem; }
  .rc .ic { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex:none; background:rgba(255,197,61,.14); }
  .rc small { display:block; color:var(--mut); font-size:.68rem; }
  .rc b { font-variant-numeric:tabular-nums; }
  .chase { margin-top:2px; padding:9px 13px; border-radius:11px; font-size:.76rem; background:rgba(47,230,167,.08); border:1px solid rgba(47,230,167,.3); }
  .foot { color:#5b6f92; font-size:.7rem; margin-top:20px; line-height:1.6; }
  .foot a { color:var(--accent); }
  .skel { color:var(--mut); font-size:.9rem; padding:60px; text-align:center; }
  svg text { font-family:'Segoe UI',system-ui,sans-serif; }
</style>

<script>window.AF_TOPNAV = { breadcrumb: [
  { label:'Inicio', href:'/' },
  { label:'Dashboard', href:'/dashboard/' },
  { label:'Resumen Ejecutivo', icon:'bi-speedometer2', current:true }
] };</script>
<div id="af-topnav"></div>

<div class="main">
  <div class="head fade">
    <h1><i class="bi bi-lightning-charge-fill" style="color:var(--gold)"></i> <span>Resumen Ejecutivo</span></h1>
    <select id="selMes" onchange="pintar()"></select>
    <span class="sub" id="subInfo"></span>
    <span style="flex:1"></span>
    <a href="/dashboard/" style="color:var(--accent);font-size:.78rem;text-decoration:none;font-weight:700"><i class="bi bi-bar-chart-line"></i> Dashboard completo</a>
  </div>
  <div id="cont" class="skel">Cargando…</div>
</div>

<script src="/js/auth-guard.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const num = v => Number(v).toLocaleString('es-CL');
const clp = v => '$' + Math.round(v).toLocaleString('es-CL');
const mm1 = v => (v/1e6).toLocaleString('es-CL',{maximumFractionDigits:1});
const MESN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const mesLab = m => MESN[+m.slice(5,7)-1] + ' ' + m.slice(2,4);
const esOt = r => r.estado_credito === 'OTORGADO' || r.estado_credito === 'PREPAGADO';
const esAp = r => esOt(r) || r.estado_credito === 'APROBADO' || r.estado_credito === 'CARTA_APROBACION';
const sum = (a,k) => a.reduce((s,r)=>s+(r[k]||0),0);
const fRef = r => r.fecha_otorgado || r.fecha_estado || '';
let RAW = [], PPTO = [], MODO = 'ops';

async function cargar(){
  const H = { Authorization:'Bearer ' + sessionStorage.getItem('token') };
  const [d,p] = await Promise.all([
    fetch('/api/dashboard/datos',{headers:H}).then(r=>r.json()),
    fetch('/api/dashboard/presupuesto',{headers:H}).then(r=>r.json()).catch(()=>null)]);
  if(!d.success){ $('#cont').textContent='No se pudieron cargar los datos.'; return; }
  RAW = d.raw; PPTO = (p&&p.data)||[];
  const meses = [...new Set(RAW.map(r=>r.mes))].filter(Boolean).sort().reverse();
  $('#selMes').innerHTML = meses.map(m=>`<option value="${m}">${mesLab(m)}</option>`).join('');
  $('#subInfo').textContent = num(RAW.length)+' operaciones · '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  pintar();
}

function delta(act,ant){
  if(!ant) return '<span class="delta flat">s/base</span>';
  const p=(act-ant)/ant*100, c=p>0.5?'up':p<-0.5?'down':'flat', f=p>0.5?'▲':p<-0.5?'▼':'＝';
  return `<span class="delta ${c}">${f} ${Math.abs(p).toLocaleString('es-CL',{maximumFractionDigits:1})}%</span>`;
}
function spark(vals,w,h,color){
  const mx=Math.max(...vals,1), mn=Math.min(...vals,0);
  const pt=vals.map((v,i)=>[(i/(vals.length-1))*w, h-4-((v-mn)/(mx-mn||1))*(h-8)]);
  const d='M'+pt.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const last=pt[pt.length-1];
  return `<svg width="${w}" height="${h}" class="spark"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
}

/* Curva acumulada dia a dia: mes actual vs mes anterior vs ritmo presupuesto */
function curva(mes, mesAnt, pp, diaCorte, diasMes){
  const W=760, H=280, P={l:52,r:16,t:16,b:26};
  const serieDia = (m, dias) => {
    const acc = new Array(dias+1).fill(0);
    RAW.filter(r=>r.mes===m && esOt(r)).forEach(r=>{
      const d = Math.min(+(fRef(r).slice(8,10))||1, dias);
      acc[d] += MODO==='monto' ? (r.monto_financiado||0)/1e6 : 1;
    });
    for(let i=1;i<=dias;i++) acc[i]+=acc[i-1];
    return acc;
  };
  const diasAnt = 31;
  const cur = serieDia(mes, diasMes), ant = serieDia(mesAnt, diasAnt);
  const meta = pp ? (MODO==='monto' ? +pp.monto : +pp.ops) : null;
  const tope = Math.max(cur[diasMes], ant[diasAnt], meta||0, 1)*1.08;
  const X = d => P.l + (d-1)/(Math.max(diasMes,diasAnt)-1)*(W-P.l-P.r);
  const Y = v => H-P.b - v/tope*(H-P.t-P.b);
  const path = (acc,dias,hasta) => { let s=''; for(let d=1; d<=Math.min(dias,hasta); d++) s+=(d===1?'M':'L')+X(d).toFixed(1)+','+Y(acc[d]).toFixed(1)+' '; return s; };
  const pCur = path(cur,diasMes,diaCorte), pAnt = path(ant,diasAnt,31);
  // area bajo la curva actual
  const xFin = X(Math.min(diasMes,diaCorte));
  const area = pCur + `L${xFin.toFixed(1)},${(H-P.b)} L${X(1).toFixed(1)},${H-P.b} Z`;
  // grilla y
  let g='';
  for(let i=0;i<=4;i++){ const v=tope/4*i, y=Y(v);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#16233f" stroke-width="1"/>
        <text x="${P.l-8}" y="${y+4}" text-anchor="end" fill="#5b6f92" font-size="10">${MODO==='monto'?'$'+Math.round(v)+'M':Math.round(v)}</text>`; }
  for(let d=5; d<=Math.max(diasMes,diasAnt); d+=5)
    g+=`<text x="${X(d)}" y="${H-8}" text-anchor="middle" fill="#5b6f92" font-size="10">${d}</text>`;
  const metaLn = meta ? `<line x1="${P.l}" y1="${Y(meta)}" x2="${W-P.r}" y2="${Y(meta)}" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="3 5" opacity=".85"/>
    <text x="${W-P.r}" y="${Y(meta)-6}" text-anchor="end" fill="var(--gold)" font-size="10" font-weight="700">meta ${MODO==='monto'?'$'+num(meta)+' MM':num(meta)+' ops'}</text>` : '';
  const dot = pCur ? `<circle cx="${xFin.toFixed(1)}" cy="${Y(cur[Math.min(diasMes,diaCorte)]).toFixed(1)}" r="4.5" fill="var(--accent2)">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2s" repeatCount="indefinite"/></circle>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${g}${metaLn}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${pAnt}" fill="none" stroke="#66799c" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>
    <path d="${pCur}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(0,166,255,.55))"/>
    ${dot}</svg>`;
}

// pct = % real a hoy · proy = % con que cerraría el mes al ritmo actual.
// El tramo real va sólido; de ahí hasta la proyección va el MISMO color más claro
// y lo que falta para el presupuesto queda en rojo.
function gauge(pct, proy){
  const r=74, cx=95, cy=95;
  const a0=-210, a1=30, ang=p=>a0+(a1-a0)*Math.min(Math.max(p,0),100)/100;
  const arc=(from,to,color,w,op)=>{
    if(to-from<0.4) return '';
    const f=from*Math.PI/180, t=to*Math.PI/180;
    const x1=cx+r*Math.cos(f), y1=cy+r*Math.sin(f), x2=cx+r*Math.cos(t), y2=cy+r*Math.sin(t);
    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${(to-from)>180?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`; };
  const col = pct==null?'#5b6f92': pct>=100?'var(--ok)': pct>=70?'var(--accent)':'var(--gold)';
  const pr = (pct==null||proy==null)?null:Math.max(proy,pct);
  return `<svg width="190" height="150" viewBox="0 0 190 150">
    ${arc(a0,a1,'#14203a',13,1)}
    ${pr!=null&&pr<100?arc(ang(pr),a1,'var(--bad)',13,.6):''}
    ${pr!=null?arc(ang(pct),ang(pr),col,13,.34):''}
    ${pct!=null?arc(a0,ang(pct),col,13,1):''}
  </svg>`;
}

function donut(entries, total){
  const R=54, r2=36, cx=70, cy=70; let a=-90, out='';
  entries.forEach(([k,v,color])=>{
    const frac=v/Math.max(total,1), a2=a+frac*360;
    if(frac<=0) return;
    const big=frac>0.5?1:0;
    const p=(ang)=>[cx+R*Math.cos(ang*Math.PI/180), cy+R*Math.sin(ang*Math.PI/180)];
    const q=(ang)=>[cx+r2*Math.cos(ang*Math.PI/180), cy+r2*Math.sin(ang*Math.PI/180)];
    const [x1,y1]=p(a),[x2,y2]=p(a2-0.7),[x3,y3]=q(a2-0.7),[x4,y4]=q(a);
    out+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${r2},${r2} 0 ${big} 0 ${x4},${y4} Z" fill="${color}" opacity=".92"/>`;
    a=a2;
  });
  return `<svg width="140" height="140" viewBox="0 0 140 140">${out}
    <text x="70" y="66" text-anchor="middle" fill="var(--tx)" font-size="19" font-weight="800">${num(total)}</text>
    <text x="70" y="82" text-anchor="middle" fill="var(--mut)" font-size="9">OTORGADAS</text></svg>`;
}

function pintar(){
  const mes=$('#selMes').value; if(!mes) return;
  const hoy=new Date();
  const mesHoy=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
  const esActual=mes===mesHoy;
  const [aa,mn]=mes.split('-').map(Number);
  const diasMes=new Date(aa,mn,0).getDate();
  const diaCorte=esActual?hoy.getDate():diasMes;
  const mesAnt=mn===1?(aa-1)+'-12':aa+'-'+String(mn-1).padStart(2,'0');

  const delMes=RAW.filter(r=>r.mes===mes), ot=delMes.filter(esOt);
  const otAntIg=RAW.filter(r=>r.mes===mesAnt && esOt(r) && (+(fRef(r).slice(8,10))||1)<=diaCorte);
  const monto=sum(ot,'monto_financiado'), ingreso=sum(ot,'ingreso_neto_total');
  const montoA=sum(otAntIg,'monto_financiado'), ingresoA=sum(otAntIg,'ingreso_neto_total');
  const tk=ot.length?monto/ot.length:0, tkA=otAntIg.length?montoA/otAntIg.length:0;

  // series 12m para sparklines
  const m12=[...new Set(RAW.map(r=>r.mes))].filter(m=>m&&m<=mes).sort().slice(-12);
  const s12=m12.map(m=>{ const o=RAW.filter(r=>r.mes===m&&esOt(r)); return { n:o.length, monto:sum(o,'monto_financiado'), ing:sum(o,'ingreso_neto_total'), tk:o.length?sum(o,'monto_financiado')/o.length:0 }; });

  // presupuesto
  const pp=PPTO.find(x=>x.mes===mes);
  const pctOps=pp&&pp.ops?ot.length/pp.ops*100:null;
  const pctM=pp&&pp.monto?(monto/1e6)/pp.monto*100:null;
  const ritmo=diaCorte>0?ot.length/diaCorte:0;
  const proyOps=esActual?Math.round(ritmo*diasMes):ot.length;
  const proyM=esActual&&diaCorte>0?monto/diaCorte*diasMes:monto;
  // % con que cerraría el mes al ritmo de hoy (solo tiene sentido en el mes en curso)
  const pctProy=esActual&&pp&&pp.ops?proyOps/pp.ops*100:null;

  // heatmap del mes
  const porDia={}; ot.forEach(r=>{ const d=+(fRef(r).slice(8,10))||0; if(d) porDia[d]=(porDia[d]||0)+1; });
  const maxD=Math.max(...Object.values(porDia),1);
  const prim=new Date(aa,mn-1,1).getDay(); // 0=Dom
  const off=(prim+6)%7; // Lun=0
  // Q esperado por día: reparte el presupuesto según el peso histórico de cada
  // día de la semana (últimos 3 meses cerrados — el sábado pesa más que el lunes)
  const pesoDS=[0,0,0,0,0,0,0];
  m12.slice(-4,-1).forEach((m,ix)=>{ RAW.filter(r=>r.mes===m&&esOt(r)).forEach(r=>{
    const f=fRef(r); if(f) pesoDS[new Date(f+'T12:00:00').getDay()]++; }); });
  // Proyección propia repartida en los días que quedan: lo que falta para llegar
  // a proyOps se distribuye por el peso histórico de cada día de la semana
  const proyOpsPre=esActual&&diaCorte>0?Math.round(ot.length/diaCorte*diasMes):ot.length;
  // el reparto incluye HOY: lo pendiente se mide contra lo real hasta AYER, así hoy muestra real + meta
  const pesosFut=(()=>{ let s=0; for(let d=diaCorte;d<=diasMes;d++) s+=pesoDS[new Date(aa,mn-1,d).getDay()]||0; return s; })();
  const otAntesHoy=Object.entries(porDia).reduce((s,[d,q])=>s+((+d)<diaCorte?q:0),0);
  const espDia=d=>{ if(!esActual||d<diaCorte||!pesosFut) return null;
    return Math.max(proyOpsPre-otAntesHoy,0)*(pesoDS[new Date(aa,mn-1,d).getDay()]||0)/pesosFut; };
  let heat='<div class="heat">'+['L','M','M','J','V','S','D'].map(d=>`<div class="hd">${d}</div>`).join('');
  for(let i=0;i<off;i++) heat+='<div></div>';
  for(let d=1;d<=diasMes;d++){
    const q=porDia[d]||0, t=q/maxD, esp=espDia(d);
    const bg=q?`rgba(0,166,255,${0.15+t*0.75})`:'#0d1730';
    const fut=esActual&&d>diaCorte, esHoy=esActual&&d===diaCorte;
    heat+=`<div class="hc" style="background:${fut?'rgba(255,197,61,.05)':bg};${fut?'border-color:rgba(255,197,61,.25);border-style:dashed;':''}${esHoy?'border-color:var(--accent2);border-width:2px;':''}${q&&t>0.55?'color:#04121f;font-weight:800;':''}"
      title="${d}: ${fut?(esp!=null?'para la proyección hay que hacer '+esp.toFixed(1):'—'):q+' otorgadas'+(esHoy&&esp!=null?' · meta hoy '+esp.toFixed(1):'')}">${d}${!fut&&q?`<span class="q">${q}</span>`:''}${esp!=null?`<span class="e">${Math.round(esp)}</span>`:''}</div>`;
  }
  heat+='</div>';

  // mix institucion
  const mixM={}; ot.forEach(r=>{ const k=r.institucion||'OTRA'; (mixM[k]=mixM[k]||{n:0,ing:0}); mixM[k].n++; mixM[k].ing+=r.ingreso_neto_total||0; });
  const COL={'AUTOFIN':'#00a6ff','UNIDAD DE CREDITO':'#ffc53d','AUTOFACIL':'#2fe6a7','OTRA':'#8fa3c0'};
  const mixE=Object.entries(mixM).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[k,v.n,COL[k]||'#8fa3c0',v]);

  // embudo
  const nAp=delMes.filter(esAp).length, nOt=ot.length, nT=delMes.length;

  // rankings
  const top=k=>{ const m={}; ot.forEach(r=>{ const x=(r[k]||'').trim()||'(sin dato)'; (m[x]=m[x]||{n:0,monto:0}); m[x].n++; m[x].monto+=r.monto_financiado||0; });
    return Object.entries(m).sort((a,b)=>b[1].monto-a[1].monto).slice(0,5); };
  const podio=arr=>{ const mx=Math.max(...arr.map(x=>x[1].monto),1);
    return arr.map((x,i)=>{ const ini=x[0].split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
      return `<div class="p-it"><div class="ava ${i<3?'m'+(i+1):'mn'}">${i<3?['🥇','🥈','🥉'][i]:ini}</div>
        <div><div class="p-nm" title="${x[0]}">${x[0]}</div><div class="p-bar"><div style="width:${x[1].monto/mx*100}%"></div></div></div>
        <div class="p-v">$${mm1(x[1].monto)} MM<small>${x[1].n} ops · tk ${clp(x[1].monto/x[1].n)}</small></div></div>`; }).join('')
      || '<span class="sub">Sin operaciones</span>'; };

  // ── Radiografía del mes ──
  const conMonto=ot.filter(r=>r.monto_financiado>0&&r.tasa_cli>0);
  const tasaProm=conMonto.length?conMonto.reduce((s,r)=>s+r.tasa_cli*r.monto_financiado,0)/sum(conMonto,'monto_financiado'):0;
  const plazoProm=ot.length?sum(ot,'plazo')/ot.length:0;
  const nMayor=ot.filter(r=>r.mayor_menor==='MAYOR 200UF').length;
  const dealersAct=new Set(ot.map(r=>(r.automotora||'').trim()).filter(Boolean)).size;
  const ejecAct=new Set(ot.map(r=>(r.ejecutivo||'').trim()).filter(Boolean)).size;
  const opMax=ot.reduce((a,r)=>r.monto_financiado>(a?a.monto_financiado:0)?r:a,null);
  const margen=monto?ingreso/monto*100:0;

  // ── Año contra año (a igual día si el mes está en curso) ──
  const mesYoY=(aa-1)+'-'+String(mn).padStart(2,'0');
  const otYoY=RAW.filter(r=>r.mes===mesYoY&&esOt(r)&&(!esActual||(+(fRef(r).slice(8,10))||1)<=diaCorte));
  const hayYoY=RAW.some(r=>r.mes===mesYoY);
  const yoyRow=(k,act,ant,fmt)=>`<div class="yy"><span class="k">${k}</span><b>${fmt(act)}</b><span style="color:var(--mut);font-size:.7rem">vs ${fmt(ant)}</span>${delta(act,ant)}</div>`;

  // ── Récords históricos (meses completos, excluye el mes en curso) ──
  const histM=m12.filter(m=>m!==mesHoy).map(m=>{ const o=RAW.filter(r=>r.mes===m&&esOt(r)); return {m,n:o.length,monto:sum(o,'monto_financiado')}; });
  const recM=histM.reduce((a,x)=>x.monto>(a?a.monto:0)?x:a,null);
  const recOps=histM.reduce((a,x)=>x.n>(a?a.n:0)?x:a,null);
  const diasHist={}; RAW.filter(esOt).forEach(r=>{ const f=fRef(r); if(f&&(!esActual||r.mes!==mes||+(f.slice(8,10))<=diaCorte)) diasHist[f]=(diasHist[f]||0)+1; });
  const recDia=Object.entries(diasHist).reduce((a,x)=>x[1]>(a?a[1]:0)?x:a,null);
  const persigue=esActual&&recM&&proyM>recM.monto; // ambos en $
  const fechaLarga=f=>{ const d=new Date(f+'T12:00:00'); return d.getDate()+' '+MESN[d.getMonth()]+' '+String(d.getFullYear()).slice(2); };

  const kpi=(lbl,val,d,cmp,sp,col)=>`<div class="card kpi fade"><div class="lbl">${lbl}</div><div class="val">${val}</div>
    <div>${d} <span class="cmp">vs ${cmp}</span></div>${spark(sp,110,44,col)}</div>`;
  const cmpTxt=mesLab(mesAnt)+(esActual?' al día '+diaCorte:'');

  $('#cont').className='';
  $('#cont').innerHTML=`
  <div class="grid kpis">
    ${kpi('Otorgadas · '+mesLab(mes), num(nOt), delta(nOt,otAntIg.length), cmpTxt, s12.map(s=>s.n), 'var(--accent2)')}
    ${kpi('Monto financiado', '$'+mm1(monto)+' <small>MM</small>', delta(monto,montoA), cmpTxt, s12.map(s=>s.monto), 'var(--ok)')}
    ${kpi('Ingreso neto operacional', '$'+mm1(ingreso)+' <small>MM</small>', delta(ingreso,ingresoA), cmpTxt, s12.map(s=>s.ing), 'var(--violet)')}
    ${kpi('Ticket promedio', clp(tk), delta(tk,tkA), cmpTxt, s12.map(s=>s.tk), 'var(--gold)')}
  </div>

  <div class="grid row-main">
    <div class="card fade" style="animation-delay:.05s">
      <h3 class="t"><i class="bi bi-activity"></i> La carrera del mes — acumulado día a día
        <span class="r">
          <button class="tog ${MODO==='monto'?'on':''}" onclick="MODO='monto';pintar()">MONTO</button>
          <button class="tog ${MODO==='ops'?'on':''}" onclick="MODO='ops';pintar()">OPERACIONES</button>
        </span></h3>
      ${curva(mes,mesAnt,pp,diaCorte,diasMes)}
      <div class="leg">
        <span><span class="dash" style="border-color:var(--accent)"></span>${mesLab(mes)} (acumulado real)</span>
        <span><span class="dash" style="border-color:#66799c;border-top-style:dashed"></span>${mesLab(mesAnt)} (mismo recorrido)</span>
        ${pp?`<span><span class="dash" style="border-color:var(--gold);border-top-style:dotted"></span>Meta del presupuesto</span>`:''}
      </div>
    </div>
    <div class="card fade gaugewrap" style="animation-delay:.1s">
      <h3 class="t" style="align-self:stretch"><i class="bi bi-bullseye"></i> Presupuesto · ${mesLab(mes)}</h3>
      ${gauge(pctOps, pctProy)}
      <div class="gnum">${pctOps==null?'—':Math.round(pctOps)+'%'}</div>
      <div class="glbl">de las ${pp?num(pp.ops):'—'} operaciones presupuestadas</div>
      ${pctProy!=null?`<div class="gleg">
        <span><i class="gsw" style="background:${pctOps>=100?'var(--ok)':pctOps>=70?'var(--accent)':'var(--gold)'}"></i>Hoy ${Math.round(pctOps)}%</span>
        <span><i class="gsw" style="background:${pctOps>=100?'var(--ok)':pctOps>=70?'var(--accent)':'var(--gold)'};opacity:.34"></i>Proyección ${Math.round(pctProy)}%</span>
        ${pctProy<100?`<span><i class="gsw" style="background:var(--bad);opacity:.6"></i>Faltaría ${num(Math.max(pp.ops-proyOps,0))} ops</span>`:''}
      </div>`:''}
      <div class="gdet">
        <div class="b"><div class="k">Ops</div><div class="v">${num(nOt)} / ${pp?num(pp.ops):'—'}</div></div>
        <div class="b"><div class="k">Monto</div><div class="v">$${mm1(monto)} / ${pp?'$'+num(pp.monto):'—'} MM ${pctM!=null?'('+Math.round(pctM)+'%)':''}</div></div>
        <div class="b"><div class="k">Ritmo</div><div class="v">${ritmo.toLocaleString('es-CL',{maximumFractionDigits:1})} ops/día</div></div>
        <div class="b"><div class="k">${esActual?'Días restantes':'Días del mes'}</div><div class="v">${esActual?diasMes-diaCorte:diasMes}</div></div>
      </div>
      ${esActual&&pp?`<div class="proy"><i class="bi bi-crosshair" style="color:var(--gold)"></i> A este ritmo el mes cierra en <b>${num(proyOps)} ops</b> y <b>$${mm1(proyM)} MM</b> —
        ${proyOps>=pp.ops?'<b style="color:var(--ok)">cumple el presupuesto</b>':`quedaría <b style="color:var(--bad)">${num(pp.ops-proyOps)} ops bajo la meta</b>`}.</div>`:''}
    </div>
  </div>

  <div class="grid row-3">
    <div class="card fade" style="animation-delay:.15s">
      <h3 class="t"><i class="bi bi-calendar3"></i> Pulso diario · ${mesLab(mes)}</h3>
      ${heat}
      <div class="leg"><span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent);margin-right:5px"></span>Q real del día</span>
      <span><span style="color:var(--gold);font-weight:800">n</span> lo que hay que hacer ese día para llegar a la proyección (según el peso de cada día de semana)</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card fade" style="animation-delay:.2s">
        <h3 class="t"><i class="bi bi-pie-chart-fill"></i> Mix por institución</h3>
        <div class="donutwrap">
          ${donut(mixE.map(x=>[x[0],x[1],x[2]]), nOt)}
          <div class="dleg">${mixE.map(x=>`<div class="it"><span class="sw" style="background:${x[2]}"></span>
            <div style="flex:1">${x[0]}<small>$${mm1(x[3].ing)} MM ingreso</small></div>
            <b>${Math.round(x[1]/Math.max(nOt,1)*100)}%</b></div>`).join('')||'<span class="sub">Sin datos</span>'}</div>
        </div>
      </div>
      <div class="card fade" style="animation-delay:.25s;flex:1">
        <h3 class="t"><i class="bi bi-funnel-fill"></i> Embudo del mes</h3>
        <div class="fun">
          <div class="fs"><div class="fill" style="background:#22335c;width:100%"></div><div class="in"><span>Ingresadas</span><span>${num(nT)}</span></div></div>
          <div class="conv">↓ ${nT?Math.round(nAp/nT*100):0}% aprobación</div>
          <div class="fs"><div class="fill" style="background:linear-gradient(90deg,#0a4d8c,var(--accent));width:${nT?Math.max(nAp/nT*100,14):0}%"></div><div class="in"><span>Aprobadas</span><span>${num(nAp)}</span></div></div>
          <div class="conv">↓ ${nAp?Math.round(nOt/nAp*100):0}% curse</div>
          <div class="fs"><div class="fill" style="background:linear-gradient(90deg,#0b7a58,var(--ok));width:${nT?Math.max(nOt/nT*100,10):0}%"></div><div class="in"><span>Otorgadas</span><span>${num(nOt)}</span></div></div>
        </div>
      </div>
    </div>
    <div class="card fade" style="animation-delay:.3s">
      <h3 class="t"><i class="bi bi-calendar2-range"></i> Año contra año · ${mesLab(mes)} vs ${mesLab(mesYoY)}${esActual?' <span style="text-transform:none;letter-spacing:0;font-weight:600">(a igual día)</span>':''}</h3>
      ${hayYoY?`<div class="yoy">
        ${yoyRow('Otorgadas', nOt, otYoY.length, num)}
        ${yoyRow('Monto financiado', monto, sum(otYoY,'monto_financiado'), v=>'$'+mm1(v)+' MM')}
        ${yoyRow('Ingreso neto operacional', ingreso, sum(otYoY,'ingreso_neto_total'), v=>'$'+mm1(v)+' MM')}
        ${yoyRow('Ticket promedio', tk, otYoY.length?sum(otYoY,'monto_financiado')/otYoY.length:0, clp)}
      </div>`:'<span class="sub">Aún no hay datos del mismo mes del año anterior.</span>'}
      <h3 class="t" style="margin-top:18px"><i class="bi bi-calendar2-week"></i> Mes contra mes · ${mesLab(mes)} vs ${mesLab(mesAnt)}${esActual?' <span style="text-transform:none;letter-spacing:0;font-weight:600">(a igual día)</span>':''}</h3>
      <div class="yoy">
        ${yoyRow('Otorgadas', nOt, otAntIg.length, num)}
        ${yoyRow('Monto financiado', monto, montoA, v=>'$'+mm1(v)+' MM')}
        ${yoyRow('Ingreso neto operacional', ingreso, ingresoA, v=>'$'+mm1(v)+' MM')}
        ${yoyRow('Ticket promedio', tk, tkA, clp)}
      </div>
    </div>
  </div>

  <div class="grid strip">
    <div class="tile fade" style="animation-delay:.28s"><div class="k"><i class="bi bi-percent"></i> Tasa promedio</div>
      <div class="v">${tasaProm.toLocaleString('es-CL',{maximumFractionDigits:2})}%</div><div class="d">ponderada por monto</div></div>
    <div class="tile fade" style="animation-delay:.3s"><div class="k"><i class="bi bi-hourglass-split"></i> Plazo promedio</div>
      <div class="v">${plazoProm.toLocaleString('es-CL',{maximumFractionDigits:0})} <small style="font-size:.75rem;color:var(--mut)">cuotas</small></div><div class="d">de las otorgadas del mes</div></div>
    <div class="tile fade" style="animation-delay:.32s"><div class="k"><i class="bi bi-cash-stack"></i> Margen del mes</div>
      <div class="v">${margen.toLocaleString('es-CL',{maximumFractionDigits:1})}%</div><div class="d">ingreso neto operacional / monto financiado</div></div>
    <div class="tile fade" style="animation-delay:.34s"><div class="k"><i class="bi bi-arrows-expand"></i> Mayor 200 UF</div>
      <div class="v">${nOt?Math.round(nMayor/nOt*100):0}%</div><div class="d">${num(nMayor)} de ${num(nOt)} operaciones</div></div>
    <div class="tile fade" style="animation-delay:.36s"><div class="k"><i class="bi bi-shop-window"></i> Dealers con negocio</div>
      <div class="v">${num(dealersAct)}</div><div class="d">${num(ejecAct)} ejecutivos con curse</div></div>
    <div class="tile fade" style="animation-delay:.38s"><div class="k"><i class="bi bi-gem"></i> Operación top</div>
      <div class="v">${opMax?clp(opMax.monto_financiado):'—'}</div><div class="d" title="${opMax?opMax.automotora:''}">${opMax?(opMax.automotora||'—'):'sin operaciones'}</div></div>
  </div>

  <div class="grid row-3">
    <div class="card fade" style="animation-delay:.4s">
      <h3 class="t"><i class="bi bi-stars" style="color:var(--gold)"></i> Salón de récords</h3>
      <div class="rec">
        ${recM?`<div class="rc"><div class="ic">🏆</div><div style="flex:1">Mejor mes en monto<small>${mesLab(recM.m)} · ${num(recM.n)} operaciones</small></div><b>$${mm1(recM.monto)} MM</b></div>`:''}
        ${recOps?`<div class="rc"><div class="ic">🚀</div><div style="flex:1">Mejor mes en operaciones<small>${mesLab(recOps.m)} · $${mm1(recOps.monto)} MM</small></div><b>${num(recOps.n)} ops</b></div>`:''}
        ${recDia?`<div class="rc"><div class="ic">⚡</div><div style="flex:1">Mejor día de la historia<small>${fechaLarga(recDia[0])}</small></div><b>${num(recDia[1])} otorgadas</b></div>`:''}
        ${esActual&&recM?(persigue
          ?`<div class="chase">🔥 <b>¡Mes récord a la vista!</b> A ritmo actual (${'$'+mm1(proyM)} MM) este mes <b>superaría</b> el récord de ${mesLab(recM.m)}.</div>`
          :`<div class="chase" style="background:rgba(0,166,255,.07);border-color:rgba(0,166,255,.3)">Para batir el récord de ${mesLab(recM.m)} faltan <b>$${mm1(recM.monto-monto)} MM</b> en ${diasMes-diaCorte} días (${diasMes-diaCorte>0?'$'+mm1((recM.monto-monto)/(diasMes-diaCorte))+' MM/día':'—'}).</div>`):''}
      </div>
    </div>
    <div class="card fade" style="animation-delay:.45s">
      <h3 class="t"><i class="bi bi-trophy-fill" style="color:var(--gold)"></i> Podio ejecutivos · ${mesLab(mes)}</h3>
      <div class="podio">${podio(top('ejecutivo'))}</div>
    </div>
    <div class="card fade" style="animation-delay:.5s">
      <h3 class="t"><i class="bi bi-shop" style="color:var(--gold)"></i> Podio dealers · ${mesLab(mes)}</h3>
      <div class="podio">${podio(top('automotora'))}</div>
    </div>
  </div>

  <div class="foot"><i class="bi bi-info-circle"></i> Misma fuente que el <a href="/dashboard/">Dashboard</a> (deduplicado por operación, desde ene-2025; otorgada = OTORGADO/PREPAGADO). Los KPIs comparan contra el mes anterior <b>a igual día</b>; la curva gris muestra el recorrido completo del mes anterior. Presupuesto editable en Dashboard → Presupuesto.</div>`;
}
cargar();
</script>
<script src="/js/topnav.js"></script>
<script src="/js/app-version.js"></script>
</body>
</html>
