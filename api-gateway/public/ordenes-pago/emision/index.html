<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emisión de Orden de Pago — AutoFácil</title>
  <!-- v2.3 — "Se paga a: banco · tipo · cuenta" visible bajo el proveedor al elegirlo · v2.2 — banco/cuenta del proveedor solo criticos con pago por Transferencia (cheque/efectivo/tarjeta no los exigen) · v2.1 — proveedor sin banco/cuenta: completar los datos de transferencia desde la emision (quedan en la ficha, auditado) · v2.0 — Centro de Costo al emitir (mantenedor Centros de Costo); queda en la orden para el reporte de gasto por área · v1.9 — Cuenta de cargo (contra la que se paga) junto a Metodo de pago; queda en la orden, el pago la hereda y el asiento acredita ese banco · v1.8 — popup de revisión pre-emisión (datos faltantes) antes de emitir · v1.7 — al EMITIR sale el correo automático a Contabilidad (plantilla odp_proveedor_contabilidad) con la factura adjunta; el adjunto viaja en el mismo request · v1.6 — adjuntar factura/boleta al emitir: respaldo en la orden + adjunto del correo a Contabilidad · v1.5 — navbar migrada al componente topnav -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --navy:#001345; --blue:#0141A2; }
    body { background:#f0f4f8; font-family:'Segoe UI',system-ui,sans-serif; margin:0; }
    .user-chip { background:rgba(255,255,255,.12); border-radius:24px; padding:5px 12px; display:flex; align-items:center; gap:8px; font-size:.85rem; }
    .avatar { width:28px; height:28px; background:#90caf9; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--blue); font-weight:700; font-size:.75rem; }
    .perfil-badge { background:rgba(144,202,249,.2); border:1px solid rgba(144,202,249,.4); color:#90caf9; border-radius:12px; padding:2px 10px; font-size:.73rem; font-weight:600; }
    .wrap { max-width:880px; margin:0 auto; padding:24px; }
    .card-af { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); padding:22px 24px; margin-bottom:18px; }
    h5.sec { font-weight:800; color:var(--navy); font-size:1rem; margin:0 0 16px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .fld { margin-bottom:2px; }
    .fld.full { grid-column:1 / -1; }
    .fld label { display:block; font-size:.7rem; font-weight:800; text-transform:uppercase; color:#64748b; letter-spacing:.3px; margin:0 0 4px; }
    .fld input, .fld select, .fld textarea { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:9px 11px; font-size:.86rem; box-sizing:border-box; font-family:inherit; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color:#0141A2; outline:none; }
    .fld textarea { min-height:64px; resize:vertical; }
    .monto-box input { font-size:1.15rem; font-weight:800; color:#0141A2; }
    .btn-af { background:linear-gradient(135deg,#0141A2,#0255c5); color:#fff; border:none; border-radius:9px; padding:11px 26px; font-size:.92rem; font-weight:700; cursor:pointer; }
    .btn-ghost { background:#fff; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 16px; font-size:.85rem; cursor:pointer; color:#334155; text-decoration:none; }
    .ok-box { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:22px; text-align:center; display:none; }
    .ok-box .num { font-size:1.5rem; font-weight:800; color:#15803d; letter-spacing:.5px; }
  </style>
</head>
<body>
<div id="af-topnav"></div>
<script>window.AF_TOPNAV={breadcrumb:[{label:'Inicio',href:'/'},{label:'Órdenes de Pago',href:'/ordenes-pago/'},{label:'Emisión',current:true}]};</script>

<div class="wrap">
  <div class="ok-box card-af" id="okBox">
    <i class="bi bi-check-circle-fill" style="font-size:2.4rem;color:#16a34a"></i>
    <p style="margin:10px 0 4px;color:#15803d;font-weight:600">Orden de pago emitida</p>
    <div class="num" id="okNum">—</div>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center">
      <button class="btn-af" onclick="nueva()"><i class="bi bi-plus-lg me-1"></i>Emitir otra</button>
      <a class="btn-ghost" href="/ordenes-pago/historial/"><i class="bi bi-clock-history me-1"></i>Ver historial</a>
    </div>
  </div>

  <form id="formCard" class="card-af">
    <h5 class="sec"><i class="bi bi-pencil-square me-2"></i>Nueva Orden de Pago</h5>
    <div class="grid2">
      <div class="fld full"><label>Proveedor *</label>
        <select id="fProv" onchange="onProvChange()"><option value="">Cargando…</option></select>
        <div id="provCuentaInfo" style="display:none;margin-top:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:7px 12px;font-size:.82rem;color:#1e40af"></div>
      </div>
      <div class="fld" id="boxProvNombre" style="display:none"><label>Nombre del proveedor (no registrado) *</label><input id="fProvNombre" maxlength="200"></div>
      <div class="fld" id="boxProvRut" style="display:none"><label>RUT (opcional)</label><input id="fProvRut" maxlength="20" placeholder="76.123.456-7" oninput="onRut()"></div>

      <!-- Proveedor SIN datos de transferencia (creado al vuelo): completarlos acá mismo -->
      <div class="fld full" id="boxProvBanco" style="display:none">
        <div style="background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:12px 14px">
          <div style="font-size:.8rem;font-weight:800;color:#9a3412;margin-bottom:8px"><i class="bi bi-exclamation-triangle me-1"></i>Este proveedor no tiene datos de transferencia — complétalos y quedan guardados en su ficha:</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end">
            <div><label>Banco *</label><input id="fProvBanco" maxlength="100" placeholder="Ej: Banco de Chile"></div>
            <div><label>Tipo de cuenta</label>
              <select id="fProvTipoCta"><option>Cuenta Corriente</option><option>Cuenta Vista</option><option>Cuenta de Ahorro</option></select></div>
            <div><label>N° de cuenta *</label><input id="fProvNumCta" maxlength="50"></div>
            <button type="button" class="btn-ghost" style="border-color:#0141A2;color:#0141A2;font-weight:700" onclick="guardarDatosProv()"><i class="bi bi-floppy me-1"></i>Guardar en ficha</button>
          </div>
        </div>
      </div>

      <div class="fld full"><label>Concepto *</label><input id="fConcepto" maxlength="300" placeholder="Ej: Arriendo oficina junio 2026"></div>

      <div class="fld"><label>Categoría</label>
        <input id="fCategoria" list="catList" maxlength="80" placeholder="Ej: Arriendo, Servicios, Insumos…">
        <datalist id="catList"><option>Arriendo</option><option>Servicios Básicos</option><option>Honorarios</option><option>Insumos</option><option>Marketing</option><option>Tecnología</option><option>Mantención</option><option>Otros</option></datalist>
      </div>
      <div class="fld"><label>Centro de Costo</label>
        <select id="fCentroCosto"><option value="">— Sin asignar —</option></select>
      </div>
      <div class="fld"><label>Tipo de Documento *</label>
        <select id="fTipoDoc" onchange="onTipo()">
          <option value="Factura">Factura</option>
          <option value="Factura Exenta">Factura Exenta</option>
          <option value="Boleta de Honorarios">Boleta de Honorarios</option>
          <option value="Boleta Exenta">Boleta Exenta</option>
          <option value="Nota de Cobro">Nota de Cobro</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="fld full">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end">
          <div class="fld monto-box" style="margin:0"><label>Monto Bruto (CLP) *</label><input id="fBruto" inputmode="numeric" placeholder="0" oninput="onMonto('BRUTO')"></div>
          <div class="fld" style="margin:0" id="impBox"><label id="impLbl">IVA 19%</label><input id="fImp" readonly placeholder="$0" style="background:#f1f5f9;color:#475569;font-weight:700"></div>
          <div class="fld monto-box" style="margin:0"><label>Monto Neto (CLP) *</label><input id="fNeto" inputmode="numeric" placeholder="0" oninput="onMonto('NETO')"></div>
        </div>
        <div style="margin-top:10px;font-size:.92rem;font-weight:700;color:#334155">A pagar: <span id="pvPagar" style="color:#0141A2;font-weight:800;font-size:1.08rem">$0</span></div>
      </div>

      <div class="fld"><label>N° de documento</label><input id="fNumDoc" maxlength="40"></div>

      <div class="fld"><label>Fecha del documento</label><input id="fFechaDoc" type="date"></div>

      <div class="fld"><label>Método de pago</label>
        <select id="fMetodo" onchange="onProvChange()"><option value="">—</option><option>Transferencia</option><option>Cheque</option><option>Efectivo</option><option>Tarjeta</option></select>
      </div>
      <div class="fld"><label>Cuenta de cargo (contra la que se paga)</label>
        <select id="fCtaCargo"><option value="">—</option></select>
      </div>

      <div class="fld full"><label>Documento (factura / boleta)</label>
        <input type="file" id="fDoc" accept=".pdf,.jpg,.jpeg,.png,.xml" style="font-size:.84rem">
        <div style="font-size:.74rem;color:#94a3b8;margin-top:3px">Queda de respaldo en la orden y viaja adjunto en el correo a Contabilidad. Máx. 7 MB.</div>
      </div>

      <div class="fld full"><label>Observaciones</label><textarea id="fObs" maxlength="500"></textarea></div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:18px">
      <span id="errMsg" style="font-size:.84rem;color:#b91c1c;display:none"></span>
      <div style="flex:1"></div>
      <a class="btn-ghost" href="/ordenes-pago/">Cancelar</a>
      <button type="button" class="btn-af" id="btnEmitir" onclick="emitir()"><i class="bi bi-send-check me-1"></i>Emitir orden</button>
    </div>
  </form>
</div>

<script>
const token = sessionStorage.getItem('token');
const yo = JSON.parse(sessionStorage.getItem('usuario')||'null');
if (!token || !yo) location.href='/login.html';

const H = { 'Content-Type':'application/json', Authorization:'Bearer '+token };
const escH = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function formatRUT(v){ let x=String(v||'').replace(/[^0-9kK]/g,'').toUpperCase(); if(!x) return ''; const dv=x.slice(-1); let n=x.slice(0,-1); n=n.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return n?`${n}-${dv}`:dv; }
function onRut(){ const el=document.getElementById('fProvRut'); el.value=formatRUT(el.value); }
const money = n => '$'+Number(Math.round(n)||0).toLocaleString('es-CL');
const numEl = id => Number(String(document.getElementById(id).value).replace(/\D/g,''))||0;
function fmtInput(id){ const el=document.getElementById(id); const n=el.value.replace(/\D/g,''); el.value=n? Number(n).toLocaleString('es-CL'):''; }
let lastBase = 'NETO';   // qué campo escribió el usuario por última vez

// Cuenta corriente de cargo (mantenedor Cuentas Bancarias): desde qué cuenta de
// la empresa se pagará. Queda en la orden y el asiento acredita ese banco real.
let CTAS = [];
async function cargarCtasCargo(){
  try {
    const r = await fetch('/api/cuentas-bancarias', { headers:H });
    const j = await r.json();
    CTAS = (j.data||[]).filter(c => Number(c.activo) !== 0);
    document.getElementById('fCtaCargo').innerHTML = '<option value="">—</option>' +
      CTAS.map(c => `<option value="${c.id_cuenta}">${escH([c.nombre, c.banco, c.numero_cuenta].filter(Boolean).join(' · '))}</option>`).join('');
  } catch(e){}
}
function ctaCargoTxt(){
  const id = document.getElementById('fCtaCargo').value;
  const c = CTAS.find(x => String(x.id_cuenta) === String(id));
  return c ? [c.nombre, c.banco, c.numero_cuenta].filter(Boolean).join(' · ') : '';
}
cargarCtasCargo();

let IMPUESTOS = { IVA:19, RETENCION_HONORARIOS:15.25 };
async function cargarImpuestos(){
  try { const r = await fetch('/api/impuestos/valores', { headers:H }); const j = await r.json(); if (j.success && j.data) IMPUESTOS = { ...IMPUESTOS, ...j.data }; } catch(e){}
  onTipo();
}
// Clase tributaria según el tipo de documento.
function claseDoc(tipo){ if(tipo==='Factura') return 'IVA'; if(tipo==='Boleta de Honorarios') return 'RET'; return 'EXENTO'; }
// Calcula los 3 montos + A pagar (espejo del backend). bruto = neto + impuesto.
function calcDoc(tipo, base, valor){
  const clase = claseDoc(tipo);
  if (clase==='EXENTO') return { clase, pct:0, neto:valor, bruto:valor, imp:0, pagar:valor };
  if (clase==='IVA'){ const pct=Number(IMPUESTOS.IVA)||19;
    if (base==='BRUTO'){ const bruto=valor, neto=Math.round(bruto/(1+pct/100)), imp=bruto-neto; return {clase,pct,neto,bruto,imp,pagar:bruto}; }
    const neto=valor, imp=Math.round(neto*pct/100), bruto=neto+imp; return {clase,pct,neto,bruto,imp,pagar:bruto};
  }
  const pct=Number(IMPUESTOS.RETENCION_HONORARIOS)||15.25;
  if (base==='BRUTO'){ const bruto=valor, imp=Math.round(bruto*pct/100), neto=bruto-imp; return {clase,pct,neto,bruto,imp,pagar:neto}; }
  const neto=valor, bruto=Math.round(neto/(1-pct/100)), imp=bruto-neto; return {clase,pct,neto,bruto,imp,pagar:neto};
}
function lblImp(clase, pct){ return clase==='IVA'?`IVA ${pct}%` : clase==='RET'?`Retención ${pct}%` : 'Exento'; }
function pintarMontos(m){
  document.getElementById('fBruto').value = m.bruto? Number(m.bruto).toLocaleString('es-CL') : '';
  document.getElementById('fNeto').value  = m.neto?  Number(m.neto).toLocaleString('es-CL')  : '';
  document.getElementById('fImp').value   = m.clase==='EXENTO' ? '—' : money(m.imp);
  document.getElementById('impLbl').textContent = lblImp(m.clase, m.pct);
  document.getElementById('impBox').style.opacity = m.clase==='EXENTO' ? '.5' : '1';
  document.getElementById('pvPagar').textContent = money(m.pagar);
}
// El usuario edita Bruto o Neto → formatea ese campo y calcula el resto.
function onMonto(which){
  lastBase = which;
  fmtInput(which==='BRUTO'?'fBruto':'fNeto');
  const tipo = document.getElementById('fTipoDoc').value;
  const valor = which==='BRUTO'? numEl('fBruto') : numEl('fNeto');
  if (!valor){ document.getElementById('fImp').value=''; document.getElementById('pvPagar').textContent='$0';
    document.getElementById(which==='BRUTO'?'fNeto':'fBruto').value=''; return; }
  pintarMontos(calcDoc(tipo, which, valor));
}
// Cambió el tipo de documento → recalcula desde el último campo escrito.
function onTipo(){
  const tipo = document.getElementById('fTipoDoc').value;
  const base = numEl(lastBase==='BRUTO'?'fBruto':'fNeto') ? lastBase
             : (numEl('fNeto') ? 'NETO' : (numEl('fBruto') ? 'BRUTO' : null));
  if (!base){ document.getElementById('impLbl').textContent = lblImp(claseDoc(tipo), claseDoc(tipo)==='IVA'?(Number(IMPUESTOS.IVA)||19):(Number(IMPUESTOS.RETENCION_HONORARIOS)||15.25)); document.getElementById('impBox').style.opacity = claseDoc(tipo)==='EXENTO'?'.5':'1'; return; }
  lastBase = base;
  pintarMontos(calcDoc(tipo, base, numEl(base==='BRUTO'?'fBruto':'fNeto')));
}

let PROVS = [];
async function cargarProv(){
  try {
    const r = await fetch('/api/ordenes-pago/proveedores', { headers:H });
    const j = await r.json();
    PROVS = j.data||[];
    const opts = (j.data||[]).map(p=>`<option value="${p.id}">${escH(p.nombre)}${p.rut?' — '+escH(formatRUT(p.rut)):''}</option>`).join('');
    document.getElementById('fProv').innerHTML =
      '<option value="">— Seleccionar proveedor —</option>' + opts + '<option value="__otro">+ Proveedor no registrado…</option>';
  } catch(e) {
    document.getElementById('fProv').innerHTML = '<option value="">Error al cargar</option><option value="__otro">+ Proveedor no registrado…</option>';
  }
}
function onProvChange(){
  const v = document.getElementById('fProv').value;
  const otro = v==='__otro';
  document.getElementById('boxProvNombre').style.display = otro?'':'none';
  document.getElementById('boxProvRut').style.display = otro?'':'none';
  // Proveedor registrado sin banco/cuenta → ofrecer completar los datos acá mismo
  // (solo si el pago es por Transferencia: cheque/efectivo/tarjeta no los necesitan)
  const met = document.getElementById('fMetodo').value;
  const p = (!otro && v) ? PROVS.find(x=>String(x.id)===String(v)) : null;
  const falta = p && (met === 'Transferencia' || !met) && (!(p.banco||'').trim() || !(p.numero_cuenta||'').trim());
  // Cuenta de PAGO del proveedor a la vista (a dónde se le transfiere)
  const info = document.getElementById('provCuentaInfo');
  if (p && (p.banco||'').trim() && (p.numero_cuenta||'').trim()) {
    info.innerHTML = `<i class="bi bi-bank me-1"></i>Se paga a: <b>${escH(p.banco)}</b> · ${escH(p.tipo_cuenta||'Cuenta Corriente')} <b>${escH(p.numero_cuenta)}</b>`;
    info.style.display = '';
  } else info.style.display = 'none';
  document.getElementById('boxProvBanco').style.display = falta ? '' : 'none';
  if (falta) {
    document.getElementById('fProvBanco').value = p.banco||'';
    document.getElementById('fProvNumCta').value = p.numero_cuenta||'';
    if (p.tipo_cuenta) document.getElementById('fProvTipoCta').value = p.tipo_cuenta;
  }
}
async function guardarDatosProv(){
  const id = document.getElementById('fProv').value;
  const banco = document.getElementById('fProvBanco').value.trim();
  const num = document.getElementById('fProvNumCta').value.trim();
  if (!banco || !num) return alert('Banco y N° de cuenta son requeridos.');
  try {
    const r = await fetch(`/api/ordenes-pago/proveedores/${id}/datos-transferencia`, {
      method:'PUT', headers:{...H,'Content-Type':'application/json'},
      body: JSON.stringify({ banco, tipo_cuenta: document.getElementById('fProvTipoCta').value, numero_cuenta: num })});
    const j = await r.json();
    if (!j.success) return alert(j.error||'No se pudo guardar');
    await cargarProv();
    document.getElementById('fProv').value = id;
    onProvChange();
    alert('✓ Datos de transferencia guardados en la ficha del proveedor');
  } catch(e){ alert('Error de conexión'); }
}

/* PRE-EMISIÓN: popup con la orden y los datos que faltan, ANTES de emitir. */
function emitir(){
  const err = document.getElementById('errMsg'); err.style.display='none';
  const provSel = document.getElementById('fProv').value;
  const concepto = document.getElementById('fConcepto').value.trim();
  const monto = lastBase==='BRUTO' ? numEl('fBruto') : numEl('fNeto');
  if (!provSel) { return fail('Selecciona un proveedor.'); }
  if (!concepto) return fail('El concepto es obligatorio.');
  if (monto<=0) return fail('Ingresa el monto (bruto o neto).');

  const otro = provSel==='__otro';
  const prov = otro ? { nombre: document.getElementById('fProvNombre').value.trim(), rut: document.getElementById('fProvRut').value.trim() }
                    : (PROVS.find(p=>String(p.id)===String(provSel)) || {});
  if (otro && !prov.nombre) return fail('Indica el nombre del proveedor.');
  const fDoc = document.getElementById('fDoc').files && document.getElementById('fDoc').files[0];
  const tipoDoc = document.getElementById('fTipoDoc').value;
  const m = calcDoc(tipoDoc, lastBase, monto);
  // Banco/cuenta del proveedor solo son CRÍTICOS si se paga por TRANSFERENCIA:
  // con cheque, efectivo o tarjeta no se necesitan datos de transferencia.
  const esTransf = document.getElementById('fMetodo').value === 'Transferencia' || !document.getElementById('fMetodo').value;
  const faltas = AF_ODP_PRE.check([
    { etiqueta:'RUT del proveedor', valor: prov.rut },
    ...(esTransf ? [
      { etiqueta:'Banco del proveedor (dato de transferencia)', valor: prov.banco, critico:true },
      { etiqueta:'N° de cuenta del proveedor (dato de transferencia)', valor: prov.numero_cuenta, critico:true },
    ] : []),
    { etiqueta:'Categoría', valor: document.getElementById('fCategoria').value.trim() },
    { etiqueta:'N° de documento', valor: document.getElementById('fNumDoc').value.trim() },
    { etiqueta:'Fecha del documento', valor: document.getElementById('fFechaDoc').value },
    { etiqueta:'Método de pago', valor: document.getElementById('fMetodo').value },
    { etiqueta:'Cuenta de cargo', valor: ctaCargoTxt() },
    { etiqueta:'Documento adjunto (factura/boleta)', valor: fDoc ? fDoc.name : '' },
  ]);
  const F = (k,v)=>`<tr><td style="padding:3px 12px 3px 0;color:#64748b;white-space:nowrap">${k}</td><td style="font-weight:600">${escH(v||'—')}</td></tr>`;
  let dlg = document.getElementById('dlgPre');
  if(!dlg){ dlg=document.createElement('dialog'); dlg.id='dlgPre'; dlg.style.cssText='border:none;border-radius:14px;max-width:560px;width:94%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3)'; document.body.appendChild(dlg); }
  dlg.innerHTML = `
    <div style="background:linear-gradient(135deg,#012d70,#0141A2);color:#fff;padding:14px 20px;font-weight:800">Revisión antes de emitir</div>
    <div style="padding:16px 20px;font-size:.88rem">
      ${AF_ODP_PRE.render(faltas)}
      <table style="width:100%;border-collapse:collapse">
        ${F('Proveedor', prov.nombre)}${F('RUT', prov.rut)}
        ${F('Concepto', concepto)}${F('Documento', tipoDoc + (document.getElementById('fNumDoc').value.trim()? ' N° '+document.getElementById('fNumDoc').value.trim():''))}
        ${F('Neto', money(m.neto))}${F(m.clase==='RET'?'Retención':'IVA', money(m.imp))}
        ${F('A PAGAR', money(m.pagar))}
        ${F('Transferir a', [prov.banco, prov.numero_cuenta].filter(Boolean).join(' · '))}
        ${F('Método de pago', document.getElementById('fMetodo').value)}
        ${F('Cuenta de cargo', ctaCargoTxt())}
        ${F('Adjunto', fDoc ? fDoc.name : null)}
      </table>
    </div>
    <div style="padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:10px;justify-content:flex-end">
      <button onclick="document.getElementById('dlgPre').close()" style="background:#f1f5f9;border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer">Volver a corregir</button>
      <button onclick="document.getElementById('dlgPre').close();emitirDefinitivo()" style="background:#0141A2;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer"><i class="bi bi-send-check me-1"></i>Emitir definitivo</button>
    </div>`;
  dlg.showModal();
}

async function emitirDefinitivo(){
  const provSel = document.getElementById('fProv').value;
  const concepto = document.getElementById('fConcepto').value.trim();
  let body = { concepto,
    tipo_documento: document.getElementById('fTipoDoc').value,
    monto_base: lastBase,
    monto_bruto: numEl('fBruto'),
    monto_neto: numEl('fNeto'),
    categoria: document.getElementById('fCategoria').value.trim(),
    centro_costo: document.getElementById('fCentroCosto').value,
    numero_documento: document.getElementById('fNumDoc').value.trim(),
    fecha_documento: document.getElementById('fFechaDoc').value || null,
    metodo_pago: document.getElementById('fMetodo').value,
    id_cuenta_bancaria: parseInt(document.getElementById('fCtaCargo').value) || null,
    observaciones: document.getElementById('fObs').value.trim() };
  if (provSel==='__otro') {
    body.proveedor_nombre = document.getElementById('fProvNombre').value.trim();
    body.proveedor_rut = document.getElementById('fProvRut').value.trim();
  } else { body.id_proveedor = parseInt(provSel); }

  const btn = document.getElementById('btnEmitir'); btn.disabled=true; btn.innerHTML='<i class="bi bi-hourglass-split me-1"></i>Emitiendo…';
  try {
    // El adjunto viaja EN el mismo request de la emisión: así el correo automático
    // a Contabilidad sale con la factura incluida.
    const fDoc = document.getElementById('fDoc').files && document.getElementById('fDoc').files[0];
    if (fDoc) {
      if (fDoc.size > 7*1024*1024) return fail('El documento adjunto debe pesar máximo 7 MB.');
      const b64 = await new Promise((ok,ko)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(',')[1]); fr.onerror=ko; fr.readAsDataURL(fDoc); });
      body.adjunto = { nombre: fDoc.name, mime: fDoc.type, base64: b64 };
    }
    const r = await fetch('/api/ordenes-pago/ordenes', { method:'POST', headers:H, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.success) {
      document.getElementById('formCard').style.display='none';
      document.getElementById('okNum').textContent = j.data.numero;
      document.getElementById('okBox').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    } else fail(j.error||'Error al emitir.');
  } catch(e) { fail('Error de red.'); }
  btn.disabled=false; btn.innerHTML='<i class="bi bi-send-check me-1"></i>Emitir orden';
}
function fail(m){ const e=document.getElementById('errMsg'); e.textContent=m; e.style.display='inline'; const b=document.getElementById('btnEmitir'); b.disabled=false; b.innerHTML='<i class="bi bi-send-check me-1"></i>Emitir orden'; }
function nueva(){ location.reload(); }

cargarProv();
// Centros de costo (mantenedor /mantenedores/centros-costo/) — a qué área se imputa el gasto
(async()=>{ try {
  const j = await (await fetch('/api/centros-costo', { headers:H })).json();
  const sel = document.getElementById('fCentroCosto');
  sel.innerHTML = '<option value="">— Sin asignar —</option>' +
    (j.data||[]).map(c=>`<option value="${c.nombre}">${c.codigo} · ${c.nombre}</option>`).join('');
} catch(e){} })();
cargarImpuestos();
</script>
