<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emisión de Cartolas Parque — AutoFácil</title>
  <!-- v2.0 — navbar migrada al componente topnav · v1.9 — logo oficial embebido en el PDF · v1.8 — el PDF se DIBUJA (shared/pdf-simple.js), validado con pdftotext y PyMuPDF · v1.7 — el PDF se DIBUJA con jsPDF (no captura de pantalla): no puede salir en blanco, texto seleccionable · v1.6 — PDF: se captura con la pagina al tope (determinista) en vez de corregir el desfase de scroll · v1.5 — el PDF salia en blanco con la pagina scrolleada (fix scrollY + validacion de tamaño) · boton Ver PDF · la cartola ya no dice IVA incluido · v1.4 — la cartola se manda desde el servidor con el PDF adjunto y plantilla del mantenedor (antes abria Gmail y habia que adjuntar a mano) · v1.3 — el correo del parque cae al correo_confirmacion de la ficha si no hay contacto financiero · v1.2 — columna Otorgado en la cartola (regla de arrastre: pueden venir ops de meses anteriores) · v1.1 — registrar factura del parque con cuadratura -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --navy:#001345; --blue:#0141A2; }
    body { background:#f0f4f8; font-family:'Segoe UI',system-ui,sans-serif; margin:0; }
    .topnav { background:linear-gradient(90deg,#012d70,#0255c5); color:#fff; height:60px; padding:0 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:300; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    .topnav-brand { display:flex; align-items:center; gap:8px; text-decoration:none; }
    .topnav-brand img { height:32px; filter:brightness(0) invert(1); }
    .version-badge { background:rgba(255,255,255,.15); color:rgba(255,255,255,.75); font-size:.65rem; font-weight:700; border-radius:6px; padding:2px 8px; }
    .breadcrumb-nav { color:rgba(255,255,255,.6); font-size:.85rem; display:flex; align-items:center; gap:6px; }
    .breadcrumb-nav a { color:rgba(255,255,255,.75); text-decoration:none; }
    .user-chip { background:rgba(255,255,255,.12); border-radius:24px; padding:5px 12px; display:flex; align-items:center; gap:8px; font-size:.85rem; }
    .avatar { width:28px; height:28px; background:#90caf9; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--blue); font-weight:700; font-size:.75rem; }
    .perfil-badge { background:rgba(144,202,249,.2); border:1px solid rgba(144,202,249,.4); color:#90caf9; border-radius:12px; padding:2px 10px; font-size:.73rem; font-weight:600; }
    .btn-logout { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:8px; padding:5px 12px; font-size:.82rem; cursor:pointer; }
    .wrap { max-width:1150px; margin:0 auto; padding:16px 24px 60px; }
    .barra { background:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .barra select { border:1.5px solid #d1d5db; border-radius:8px; padding:7px 12px; font-size:.86rem; font-weight:600; }
    .tabbtn { border:1.5px solid #cbd5e1; background:#fff; color:#475569; border-radius:9px; padding:7px 16px; font-size:.82rem; font-weight:700; cursor:pointer; }
    .tabbtn.on { background:var(--blue); border-color:var(--blue); color:#fff; }
    .cartola { background:#fff; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.08); margin-bottom:18px; overflow:hidden; }
    .ct-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 18px; background:#f8fafc; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; }
    .ct-head h5 { margin:0; font-weight:800; color:#012d70; font-size:1rem; }
    .paso { font-size:.68rem; font-weight:800; border-radius:12px; padding:3px 10px; }
    .p-si { background:#dcfce7; color:#166534; } .p-no { background:#f1f5f9; color:#64748b; }
    .btn { border:none; border-radius:8px; padding:6px 14px; font-size:.78rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .b-navy { background:var(--blue); color:#fff; } .b-green { background:#16a34a; color:#fff; }
    .b-amber { background:#f59e0b; color:#fff; } .b-red { background:#fff1f2; color:#b91c1c; border:1px solid #fecaca; }
    .b-light { background:#eff6ff; color:#1d4ed8; }
    .ct-body { padding:14px 18px; }
    table.det { width:100%; border-collapse:collapse; font-size:.78rem; }
    .det th { background:#0141A2; color:#fff; text-align:left; padding:5px 9px; font-size:.7rem; }
    .det th.r, .det td.r { text-align:right; }
    .det td { border-bottom:1px solid #f1f5f9; padding:5px 9px; }
    .det tr.linea td { background:#f8fafc; font-weight:700; }
    .det tr.total td { background:#eef2ff; font-weight:800; color:#012d70; border-top:2px solid #c7d2fe; font-size:.84rem; }
    .ct-datos { font-size:.72rem; color:#64748b; margin-bottom:8px; display:flex; gap:16px; flex-wrap:wrap; }
    .vacio { text-align:center; color:#94a3b8; padding:40px 0; }
    .mailrow { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    .mailrow input { border:1.5px solid #d1d5db; border-radius:8px; padding:6px 10px; font-size:.8rem; min-width:280px; }
    table.env { width:100%; border-collapse:collapse; font-size:.82rem; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.08); }
    .env th { background:#f8fafc; color:#475569; text-align:left; padding:9px 12px; font-size:.72rem; text-transform:uppercase; }
    .env td { padding:9px 12px; border-bottom:1px solid #f1f5f9; }
  </style>
</head>
<body>
<div id="af-topnav"></div>
<script>window.AF_TOPNAV={breadcrumb:[{label:'Inicio',href:'/'},{label:'Post Venta',href:'/postventa/'},{label:'Emisión de Cartolas Parque',current:true}]};</script>

<div class="wrap">
  <div class="barra">
    <b style="font-size:.85rem;color:#012d70"><i class="bi bi-envelope-paper me-1"></i>Cartolas Parque</b>
    <select id="selMes" onchange="cargar()"></select>
    <button class="tabbtn on" id="tabCartolas" onclick="verTab('cartolas')">Cartolas del mes</button>
    <button class="tabbtn" id="tabEnviadas" onclick="verTab('enviadas')">Enviadas</button>
    <span style="flex:1"></span>
    <span style="font-size:.72rem;color:#64748b">Flujo: Emitir → Aprobar → Enviar (correo) → el parque factura → ODP en <a href="/postventa/comisiones-parques/">Comisiones Parques a Pagar</a></span>
  </div>
  <div id="cont"><div class="vacio">Cargando…</div></div>
</div>

<script src="/js/pdf-simple.js"></script>
<script src="/js/logo-pdf.js"></script>
<script>
const token = sessionStorage.getItem('token');
const yo = JSON.parse(sessionStorage.getItem('usuario')||'null');
if (!token || !yo) location.href='/login.html';
function logout(){ sessionStorage.clear(); location.href='/login.html'; }
const H = { 'Content-Type':'application/json', Authorization:'Bearer '+token };
const fmtCLP = v => '$'+(parseInt(v)||0).toLocaleString('es-CL');
const escH = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => escH(s).replace(/"/g,'&quot;');
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nombreMes = m => MESES[parseInt(m.slice(5))-1]+' '+m.slice(0,4);
const fmtF = f => { if(!f) return ''; const d=new Date(f); return isNaN(d)?'':d.toLocaleDateString('es-CL'); };

let TAB='cartolas', ROWS=[], ESTADOS=new Map(), DETALLES={};

(function llenarMeses(){
  const sel = document.getElementById('selMes'); const hoy = new Date(); const ops=[];
  for (let i=0;i<14;i++){ const d=new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    ops.push(`<option value="${v}">${nombreMes(v)}</option>`); }
  sel.innerHTML = ops.join('');
})();
function mes(){ return document.getElementById('selMes').value; }
function verTab(t){ TAB=t;
  document.getElementById('tabCartolas').classList.toggle('on', t==='cartolas');
  document.getElementById('tabEnviadas').classList.toggle('on', t==='enviadas');
  cargar();
}

async function cargar(){
  const cont = document.getElementById('cont');
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    if (TAB==='enviadas') return cargarEnviadas();
    await fetch('/api/postventa/sync', { method:'POST', headers:H }).catch(()=>{});
    const [rL, rE] = await Promise.all([
      fetch('/api/comisiones-parques?mes='+mes(), { headers:H }),
      fetch('/api/comisiones-parques/cartola-estado?mes='+mes(), { headers:H }),
    ]);
    const jL = await rL.json(), jE = await rE.json();
    if (!jL.success) throw new Error(jL.error||'Error');
    ROWS = (jL.data.rows||[]).filter(r => r.ops > 0 || r.arriendo > 0);
    ESTADOS = new Map(((jE.data&&jE.data.rows)||[]).map(x=>[x.parque,x]));
    DETALLES = {};
    // detalle de operaciones de cada parque con ops
    await Promise.all(ROWS.filter(r=>r.ops>0).map(async r => {
      const j = await (await fetch('/api/comisiones-parques/detalle?mes='+mes()+'&parque='+encodeURIComponent(r.parque), { headers:H })).json();
      DETALLES[r.parque] = (j.data&&j.data.ops)||[];
    }));
    render();
  } catch(e){ cont.innerHTML = '<div class="vacio">⚠️ '+escH(e.message)+'</div>'; }
}

function render(){
  const cont = document.getElementById('cont');
  if (!ROWS.length) { cont.innerHTML = '<div class="vacio">Sin parques con movimiento en '+escH(nombreMes(mes()))+'</div>'; return; }
  cont.innerHTML = ROWS.map((r,i) => cartolaHTML(r,i)).join('');
}

function pasoChip(ok, lbl){ return `<span class="paso ${ok?'p-si':'p-no'}">${ok?'✓':'○'} ${lbl}</span>`; }

function cartolaHTML(r, i){
  const st = ESTADOS.get(r.parque) || { emitida:false, aprobada:false, enviada:false, factura:false, ficha:null };
  const f = st.ficha || {};
  const ops = DETALLES[r.parque] || [];
  const fOt = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : '—'; };
  const filas = ops.map(o => `<tr>
      <td>${escH(o.num_op||'')}</td><td>${fOt(o.fecha_otorgado)}</td><td>${escH(o.dealer||'')}</td><td>${escH(o.ejecutivo||'')}</td>
      <td class="r">${fmtCLP(o.saldo_precio)}</td><td class="r">${fmtCLP(o.com_parque)}</td>
    </tr>`).join('');
  // Contacto financiero de la ficha; si no lo tiene, el correo de confirmación del parque
  const mail = f.cf_email || f.correo_confirmacion || '';
  const puedeEmitir  = r.ops > 0 && !st.emitida;
  const puedeAprobar = r.ops > 0 && st.emitida && !st.aprobada;
  const puedeEnviar  = (r.ops === 0) || (st.aprobada && !st.enviada);
  // Reversas de ODP/pago (según etapa del mes en Comisiones Parques a Pagar)
  const revODP  = r.etapa === 'OP_EMITIDA'     ? `<button class="btn b-red" onclick="anularODP('${escA(r.parque)}')" title="Anula el correlativo (el número no se libera) y vuelve el mes a APROBADA">↶ Anular ODP ${escH(r.odp_numero||'')}</button>` : '';
  const revPago = r.etapa === 'PAGO_REALIZADO' ? `<button class="btn b-red" onclick="revertirPago('${escA(r.parque)}')" title="Deshace el pago: la ODP vuelve a por pagar">↶ Revertir pago</button>` : '';
  return `<div class="cartola">
    <div class="ct-head">
      <h5><i class="bi bi-p-square me-1"></i>${escH(r.parque)}</h5>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${pasoChip(st.emitida,'Emitida')} ${pasoChip(st.aprobada,'Aprobada')} ${pasoChip(st.enviada,'Enviada')} ${pasoChip(st.factura,'Factura')}
        <span class="paso ${r.etapa==='PAGO_REALIZADO'?'p-si':'p-no'}">${escH(r.etapa.replace(/_/g,' '))}${r.odp_numero?' · '+escH(r.odp_numero):''}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${puedeEmitir ? `<button class="btn b-navy" onclick="accion('emitir','${escA(r.parque)}')"><i class="bi bi-file-earmark-plus me-1"></i>Emitir</button>`:''}
        ${puedeAprobar ? `<button class="btn b-green" onclick="accion('aprobar','${escA(r.parque)}')"><i class="bi bi-check2-circle me-1"></i>Aprobar</button>`:''}
        ${revODP} ${revPago}
      </div>
    </div>
    <div class="ct-body">
      <div id="bloque${i}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <div>
            <div style="font-weight:800;color:#012d70;font-size:.95rem">CARTOLA COMISIONES Y ARRIENDO — ${escH(r.parque)}</div>
            <div class="ct-datos">
              <span>${escH(f.razon_social||'(razón social pendiente en la ficha)')}</span>
              ${f.rut?`<span>RUT ${escH(f.rut)}</span>`:''}
              <span>Período: <b>${escH(nombreMes(mes()))}</b></span>
            </div>
          </div>
          <img src="/img/logo.png" style="height:26px">
        </div>
        <table class="det">
          <tr><th>N° OP</th><th>Otorgado</th><th>Dealer</th><th>Ejecutivo</th><th class="r">Saldo Precio</th><th class="r">Comisión</th></tr>
          ${filas || '<tr><td colspan="6" style="color:#94a3b8">Sin operaciones en el período</td></tr>'}
          <tr class="linea"><td colspan="5">Comisión por créditos (${r.ops} operación${r.ops===1?'':'es'})</td><td class="r">${fmtCLP(r.comision_creditos)}</td></tr>
          <tr class="linea"><td colspan="5">Arriendo mensual</td><td class="r">${fmtCLP(r.arriendo)}</td></tr>
          <tr class="total"><td colspan="5">TOTAL</td><td class="r">${fmtCLP(r.total)}</td></tr>
        </table>
        <div style="font-size:.66rem;color:#94a3b8;margin-top:6px">Documento generado por AutoFácil Business Suite · favor emitir la(s) factura(s) a AUTOFACIL SPA — RUT 76.545.638-K, según el régimen tributario del parque.</div>
      </div>
      <div class="mailrow">
        <label style="font-size:.75rem;font-weight:700;color:#475569">Correo del parque:</label>
        <input id="mail${i}" value="${escA(mail)}" placeholder="finanzas@parque.cl">
        ${!mail?'<span style="font-size:.7rem;color:#b45309">⚠ sin correo de finanzas en la <a href="/dealers-incorporacion/parques.html">ficha del parque</a></span>':''}
        ${r.ops>0 ? `<button class="btn b-light" onclick="verPdf(${i})" title="Ver el PDF que se va a adjuntar, sin enviar"><i class="bi bi-file-earmark-pdf me-1"></i>Ver PDF</button> `:''}${puedeEnviar ? `<button class="btn b-amber" onclick="enviarCartola(${i},'${escA(r.parque)}',this)"><i class="bi bi-envelope-arrow-up me-1"></i>Enviar cartola (PDF + correo)</button>`
          : (st.enviada?'<span style="font-size:.72rem;color:#15803d;font-weight:700">✓ Enviada — reversable en la pestaña Enviadas</span>':'<span style="font-size:.72rem;color:#94a3b8">Se envía una vez aprobada</span>')}
        ${st.enviada && !st.factura ? `<button class="btn b-light" onclick="registrarFactura('${escA(r.parque)}',${r.total})"><i class="bi bi-receipt me-1"></i>Registrar factura</button>` : ''}
        ${st.factura_datos ? `<span style="font-size:.72rem;color:#15803d;font-weight:700">✓ Factura ${escH(st.factura_datos.numero_factura)} · ${fmtCLP(st.factura_datos.monto_bruto)}</span>` : ''}
      </div>
    </div>
  </div>`;
}

async function accion(cual, parque){
  const j = await (await fetch('/api/comisiones-parques/cartola/'+cual, { method:'POST', headers:H,
    body: JSON.stringify({ mes: mes(), parque }) })).json();
  if (!j.success) { alert(j.error||'Error'); return; }
  cargar();
}

/* Envía la cartola al parque: el correo sale del SERVIDOR con el PDF adjunto
   (espejo de la cartola dealer). El texto, la copia y el interruptor están en
   Mantenedores → Correos del Sistema, plantilla "Cartola mensual → al PARQUE". */
/* Genera el PDF de la cartola DIBUJÁNDOLO (shared/pdf-simple.js), no
   fotografiando la pantalla. html2canvas depende de cómo esté el navegador en
   ese instante — scroll, imágenes a medio cargar, el clon que hace la librería —
   y cuando falla no avisa: devuelve una hoja EN BLANCO. El 13-08-2026 un parque
   recibió así su cartola vacía. Dibujado sale igual siempre, el texto queda
   seleccionable y el archivo pesa una fracción. */
function pdfCartola(i){
  const r = ROWS[i];
  const ops = DETALLES[r.parque] || [];
  const f = (ESTADOS.get(r.parque) || {}).ficha || {};
  const doc = AF_PDF.crear();
  const AZUL=[1,65,162], NAVY=[1,45,112], GRIS=[100,116,139], TINTA=[30,41,59];
  const M = 14, FIN = doc.hoja.ancho - M;
  let y = 20;

  doc.texto(M, y, 'CARTOLA COMISIONES Y ARRIENDO', { size:13, bold:true, color:NAVY });
  doc.texto(M, y + 6.5, String(r.parque || '').toUpperCase(), { size:11, bold:true, color:NAVY });
  const ficha = [f.razon_social || '', f.rut ? 'RUT ' + f.rut : ''].filter(Boolean).join('  -  ');
  if (ficha) doc.texto(M, y + 12, ficha, { size:8, color:GRIS });
  doc.texto(M, y + 16.5, 'Periodo: ' + nombreMes(mes()), { size:8, color:GRIS });
  // Logo oficial embebido (js/logo-pdf.js); si faltara, cae al texto
  if (window.AF_LOGO_PDF) doc.imagen(FIN - 42, y - 5, 42, 42 * AF_LOGO_PDF.alto / AF_LOGO_PDF.ancho, AF_LOGO_PDF);
  else { doc.texto(FIN, y, 'AutoFacil', { size:13, bold:true, color:AZUL, align:'right' });
         doc.texto(FIN, y + 4.5, 'Credito Automotriz', { size:7, color:GRIS, align:'right' }); }
  y += 24;

  // N° OP · Otorgado · Dealer · Ejecutivo · Saldo Precio · Comisión
  const X = { op:M+2, ot:M+22, de:M+44, ej:M+100, sp:FIN-32, co:FIN-2 };
  const cabecera = () => {
    doc.rect(M, y, FIN - M, 7, AZUL);
    const o = { size:7.5, bold:true, color:[255,255,255] };
    doc.texto(X.op, y+4.8, 'N OP', o); doc.texto(X.ot, y+4.8, 'Otorgado', o);
    doc.texto(X.de, y+4.8, 'Dealer', o); doc.texto(X.ej, y+4.8, 'Ejecutivo', o);
    doc.texto(X.sp, y+4.8, 'Saldo Precio', { ...o, align:'right' });
    doc.texto(X.co, y+4.8, 'Comision', { ...o, align:'right' });
    y += 7;
  };
  cabecera();

  const fOt = v => { const m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : '-'; };
  const corta = (t, mm) => { t = String(t || ''); while (doc.ancho(t, 7.5) > mm && t.length > 4) t = t.slice(0, -2); return t; };
  for (const o of ops) {
    if (y > doc.hoja.alto - 45) { doc.paginaNueva(); y = 20; cabecera(); }
    const e = { size:7.5, color:TINTA };
    doc.texto(X.op, y+4.4, String(o.num_op || ''), e);
    doc.texto(X.ot, y+4.4, fOt(o.fecha_otorgado), e);
    doc.texto(X.de, y+4.4, corta(o.dealer, 54), e);
    doc.texto(X.ej, y+4.4, corta(o.ejecutivo, 40), e);
    doc.texto(X.sp, y+4.4, fmtCLP(o.saldo_precio), { ...e, align:'right' });
    doc.texto(X.co, y+4.4, fmtCLP(o.com_parque),  { ...e, align:'right' });
    doc.linea(M, y + 6.2, FIN, y + 6.2, [226,232,240]);
    y += 6.2;
  }

  const linea = (txt, monto, destacada) => {
    doc.rect(M, y, FIN - M, 7.5, destacada ? [238,242,255] : [248,250,252]);
    const o = { size: destacada ? 9 : 8, bold:true, color: destacada ? NAVY : [51,65,85] };
    doc.texto(M + 2, y + 5, txt, o);
    doc.texto(X.co, y + 5, fmtCLP(monto), { ...o, align:'right' });
    y += 7.5;
  };
  linea(`Comision por creditos (${r.ops} operacion${r.ops===1?'':'es'})`, r.comision_creditos, false);
  linea('Arriendo mensual', r.arriendo, false);
  linea('TOTAL', r.total, true);

  y += 9;
  doc.texto(M, y, 'Documento generado por AutoFacil Business Suite - favor emitir la(s) factura(s) a', { size:7, color:GRIS });
  doc.texto(M, y + 3.5, 'AUTOFACIL SPA - RUT 76.545.638-K, segun el regimen tributario del parque.', { size:7, color:GRIS });

  const blob = doc.salida();
  if (!blob || blob.size < 800) throw new Error('El PDF salio vacio. No se envio nada.');
  return blob;
}

/* Ver el PDF antes de mandarlo — el mismo archivo que se adjunta, sin enviar ni
   registrar nada. */
function verPdf(i){
  try { window.open(URL.createObjectURL(pdfCartola(i)), '_blank'); }
  catch(e){ alert('No se pudo generar el PDF: ' + e.message); }
}

async function enviarCartola(i, parque, btn){
  const r = ROWS.find(x=>x.parque===parque); if (!r) return;
  const mail = document.getElementById('mail'+i).value.trim();
  if (!mail) { alert('Indica el correo del parque (queda mejor guardarlo en su ficha).'); return; }
  const m = mes();
  const filename = m.replace('-','.') + ' CARTOLA COMISIONES - ' + parque.toUpperCase() + '.pdf';
  const txt = btn?.innerHTML;
  if (btn){ btn.disabled = true; btn.innerHTML = 'Enviando…'; }
  try {
    // 1) La cartola en PDF (el mismo bloque que se ve en pantalla: detalle de
    //    operaciones + línea de arriendo + total) convertida a base64
    const blob = pdfCartola(i);
    const base64 = await new Promise((ok,err)=>{ const fr=new FileReader();
      fr.onload=()=>ok(String(fr.result).replace(/^data:[^;]+;base64,/,'')); fr.onerror=err; fr.readAsDataURL(blob); });

    // 2) El servidor manda el correo con el adjunto y registra el envío
    const j = await (await fetch('/api/comisiones-parques/cartola/enviar', { method:'POST', headers:H,
      body: JSON.stringify({ mes:m, parque, mail, arriendo:r.arriendo, comision:r.comision_creditos,
        total:r.total, ops:r.ops, adjunto:{ nombre:filename, base64 } }) })).json();
    if (!j.success) throw new Error(j.error||'Error registrando el envío');

    const c = j.data?.correo || {};
    alert(c.enviado
      ? 'Cartola enviada a ' + mail + (c.cc?.length ? '\n(con copia a ' + c.cc.join(', ') + ')' : '') + '\nEl PDF va adjunto.'
      : 'Envío registrado, pero el correo NO salió: ' + (c.motivo||'motivo desconocido') +
        '\nRevisa la plantilla en Mantenedores → Correos del Sistema.');
  } catch(e){ alert('Error enviando la cartola: ' + e.message); }
  finally { if (btn){ btn.disabled = false; btn.innerHTML = txt; } cargar(); }
}

async function registrarFactura(parque, total){
  const numero = prompt('N° de la factura del parque '+parque+':'); if (numero===null || !numero.trim()) return;
  const fecha = prompt('Fecha de la factura (AAAA-MM-DD, vacío = hoy):') || '';
  const monto = prompt('Monto BRUTO de la factura (debe cuadrar con el total de la cartola: '+fmtCLP(total)+'):', total);
  if (monto===null) return;
  const j = await (await fetch('/api/comisiones-parques/cartola/factura', { method:'POST', headers:H,
    body: JSON.stringify({ mes:mes(), parque, numero:numero.trim(), fecha:fecha.trim()||null, monto:String(monto).replace(/[^\d]/g,'') }) })).json();
  if (!j.success) { alert(j.error||'Error'); return; }
  alert('Factura registrada y cuadrada ✓ — FACTURA RECIBIDA marcada en las operaciones del parque.');
  cargar();
}

async function anularODP(parque){
  const motivo = prompt('Motivo de la anulación de la ODP (queda auditado):'); if (motivo===null) return;
  const j = await (await fetch('/api/comisiones-parques/anular-odp', { method:'POST', headers:H,
    body: JSON.stringify({ mes:mes(), parque, motivo }) })).json();
  if (!j.success) { alert(j.error||'Error'); return; }
  cargar();
}
async function revertirPago(parque){
  const motivo = prompt('Motivo de la reversa del pago (queda auditado):'); if (motivo===null) return;
  const j = await (await fetch('/api/comisiones-parques/revertir-pago', { method:'POST', headers:H,
    body: JSON.stringify({ mes:mes(), parque, motivo }) })).json();
  if (!j.success) { alert(j.error||'Error'); return; }
  cargar();
}

async function cargarEnviadas(){
  const cont = document.getElementById('cont');
  const j = await (await fetch('/api/comisiones-parques/cartolas-enviadas?mes='+mes(), { headers:H })).json();
  const rows = j.data||[];
  if (!rows.length) { cont.innerHTML = '<div class="vacio">Sin cartolas enviadas en '+escH(nombreMes(mes()))+'</div>'; return; }
  cont.innerHTML = `<table class="env">
    <tr><th>Parque</th><th>Mes</th><th>Correo</th><th style="text-align:right">Arriendo</th><th style="text-align:right">Comisión</th><th style="text-align:right">Total</th><th>Enviada por</th><th>Fecha</th><th></th></tr>
    ${rows.map(e=>`<tr>
      <td><b>${escH(e.parque)}</b></td><td>${escH(e.mes)}</td><td>${escH(e.mail||'—')}</td>
      <td style="text-align:right">${fmtCLP(e.arriendo)}</td><td style="text-align:right">${fmtCLP(e.comision)}</td>
      <td style="text-align:right"><b>${fmtCLP(e.total)}</b></td>
      <td>${escH(e.enviado_por||'')}</td><td>${fmtF(e.fecha_envio)}</td>
      <td><button class="btn b-red" onclick="reversarEnvio(${e.id},'${escA(e.parque)}')">↶ Reversar</button></td>
    </tr>`).join('')}
  </table>`;
}
async function reversarEnvio(id, parque){
  if (!confirm('¿Reversar el envío de la cartola de '+parque+'? Se quita la etapa CARTOLA ENVIADA (las previas se conservan) y podrás reenviarla.')) return;
  const j = await (await fetch('/api/comisiones-parques/cartolas-enviadas/'+id, { method:'DELETE', headers:H })).json();
  if (!j.success) { alert(j.error||'Error'); return; }
  cargarEnviadas();
}

cargar();
