<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emisión Orden de Pago Comisión — AutoFácil</title>
  <!-- v2.19 — los montos de la factura se toman de la op que TRAE el desglose (titular), sin depender del orden de carga · v2.18 — la vista previa ya NO reserva el N° de ODP (POR ASIGNAR hasta emitir; el correo sale con el real) · v2.17 — resumen narrado desde el neto (+IVA / −retención / emisor retiene) con referencia bruta · v2.16 — cuadratura de boleta repone el IVA (bruto boleta = neto factura) antes de comparar contra las comisiones brutas · v2.15 — recuadro pre-emisión con datos faltantes en el popup Ver orden · v2.14 — botón 📎 por grupo: sube la factura (respaldo en el almacén) y viaja ADJUNTA en el correo de la ODP a Contabilidad · v2.13 — sin boton Enviar Correo (emitir ya lo manda solo) y el texto ya no dice "adjunto" (la orden va en el cuerpo) · v2.12 — navbar migrada al componente topnav · v2.10 — tipo de cuenta por defecto Cuenta Corriente si la ficha no lo indica · v2.9 — emitir manda el correo a Contabilidad automaticamente · v2.8 — boton Enviar Correo respeta el check Activo del mantenedor · v2.7 — desglose por motor único AF_IMPUESTO (comisión BRUTA, IVA incluido) -->
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --navy:#012d70; --blue:#0141A2; --accent:#0255c5; --bg:#f0f4f8; }
    body { background:var(--bg); font-family:'Segoe UI',system-ui,sans-serif; margin:0; }
    .user-chip { background:rgba(255,255,255,.12); border-radius:24px; padding:5px 12px; display:flex; align-items:center; gap:8px; font-size:.85rem; }
    .avatar { width:28px; height:28px; background:#90caf9; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--blue); font-weight:700; font-size:.75rem; }
    .perfil-badge { background:rgba(144,202,249,.2); border:1px solid rgba(144,202,249,.4); color:#90caf9; border-radius:12px; padding:2px 10px; font-size:.73rem; font-weight:600; }
    .main { max-width:1280px; margin:0 auto; padding:24px; }
    .af-banner { background:linear-gradient(135deg,#012d70,#0141A2 55%,#009AFE); border-radius:16px; color:#fff; padding:22px 30px; margin-bottom:22px; display:flex; align-items:center; gap:16px; }
    .af-banner i { font-size:2.2rem; opacity:.85; }
    .af-banner h2 { font-weight:700; margin:0 0 2px; font-size:1.25rem; }
    .af-banner p { opacity:.82; margin:0; font-size:.86rem; }
    .card-box { background:#fff; border-radius:14px; box-shadow:0 1px 6px rgba(0,0,0,.07); padding:18px 20px; }
    table.lista { width:100%; border-collapse:collapse; font-size:.84rem; }
    table.lista th { background:#0141A2; color:#fff; font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; text-align:left; position:sticky; top:0; }
    table.lista td { padding:8px 10px; border-bottom:1px solid #eef2f7; }
    table.lista tr:hover td { background:#f8fafc; }
    .pill { background:#e0e7ff; color:#3730a3; border-radius:6px; padding:1px 8px; font-size:.72rem; font-weight:700; }
    .dias { font-weight:800; }
    .dias.alto { color:#dc2626; } .dias.medio { color:#b45309; }
    .btn-ver { background:#0141A2; color:#fff; border:none; border-radius:7px; padding:5px 12px; font-size:.78rem; font-weight:700; cursor:pointer; }
    .vacio { text-align:center; color:#94a3b8; padding:40px 0; }
    .ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
    .ov.open { display:flex; }
    .op-modal { background:#fff; border-radius:12px; width:97%; max-width:1180px; margin:auto; }
    .op-modal-head { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #e5e7eb; }
    .op-modal-head h5 { margin:0; font-weight:700; font-size:1rem; }
    .op-modal-body { padding:16px; }
    .op-modal-foot { padding:14px 20px; border-top:1px solid #e5e7eb; display:flex; gap:10px; justify-content:flex-end; }
    .btn-copiar { background:#16a34a; color:#fff; border:none; border-radius:8px; padding:9px 18px; font-weight:700; cursor:pointer; }
    .btn-emitir { background:#0141A2; color:#fff; border:none; border-radius:8px; padding:9px 18px; font-weight:700; cursor:pointer; }
    .btn-cerrar { background:#f1f5f9; color:#374151; border:none; border-radius:8px; padding:9px 16px; font-weight:600; cursor:pointer; }
    .toast { position:fixed; top:70px; right:20px; background:#16a34a; color:#fff; padding:12px 18px; border-radius:9px; font-weight:600; font-size:.88rem; z-index:2000; display:none; }
  </style>
</head>
<body>
<div id="af-topnav"></div>
<script>window.AF_TOPNAV={breadcrumb:[{label:'Inicio',href:'/'},{label:'Post Venta',href:'/postventa/'},{label:'Emisión Orden de Pago Comisión',current:true}]};</script>

<div class="main">
  <div class="af-banner"><i class="bi bi-receipt"></i><div>
    <h2>Emisión Orden de Pago — Comisión</h2>
    <p>Operaciones con <b>factura recibida</b> pendientes de emitir. Revisa, envía a Contabilidad y emítela.</p>
  </div></div>

  <div class="card-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:700;color:var(--navy)" id="resumen">—</div>
      <input id="buscar" placeholder="Buscar OP, dealer, RUT…" oninput="render()" style="border:1.5px solid #d1d5db;border-radius:8px;padding:7px 12px;font-size:.85rem;width:280px;max-width:50%">
    </div>
    <div style="overflow-x:auto">
      <table class="lista">
        <thead><tr>
          <th>N° OP</th><th>Financiera</th><th>Dealer</th><th>RUT</th>
          <th style="text-align:right">Comisión</th><th>Factura</th><th>Días</th><th></th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="vacio"><div class="spinner-border spinner-border-sm"></div> Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="op-modal">
    <div class="op-modal-head"><h5>Orden de Pago de Comisión</h5><button class="btn-cerrar" onclick="cerrar()"><i class="bi bi-x-lg"></i></button></div>
    <div class="op-modal-body"><div id="preAvisos"></div><div id="docWrap"></div></div>
    <div class="op-modal-foot">
      <button class="btn-cerrar" onclick="cerrar()">Cancelar</button>
      <button class="btn-emitir" onclick="emitir()"><i class="bi bi-send-check me-1"></i>Emitir orden</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/js/desglose-impuesto.js"></script>
<script src="/js/odp-preemision.js"></script>
<script>
const token = sessionStorage.getItem('token');
const yo = JSON.parse(sessionStorage.getItem('usuario')||'null');
if (!token || !yo) location.href='/login.html';

const hdr = () => ({ 'Content-Type':'application/json', Authorization:'Bearer '+token });
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
const fmt = n => '$' + Math.round(Number(n)||0).toLocaleString('es-CL');
const fechaCL = d => d ? new Date(d).toLocaleDateString('es-CL',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const periodoCL = d => { const x = d ? new Date(d) : new Date(); return MESES[x.getUTCMonth()] + '-' + String(x.getUTCFullYear()).slice(2); };

let DATA = [], actual = null, IMPUESTOS = { IVA:19, RETENCION_HONORARIOS:15.25 };
// Plantilla editable del correo (mantenedor Post Venta → config correo_orden_comision)
let CORREO = {
  asunto: 'Orden de Pago de Comisión N° {nOrden} — {dealer} (OP {num_op})',
  cuerpo: 'Estimado Equipo de Contabilidad:\n\nA continuación encontrarán la Orden de Pago de Comisión N° {nOrden} para el pago de la Comisión a {dealer} del Crédito N° {num_op} otorgado por {financiera}, {doc} N° {numero_factura} recepcionada por AutoFácil el día {fecha_recepcion}.\n\nLes recordamos que deben marcar en el módulo de Comisión Pagada, de manera de informar al Ejecutivo y cerrar el flujo operativo de esta transacción.',
  firma: 'Saludos cordiales,\nÁrea de Operaciones',
};
const escH = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function valsDe(ops){
  if (!Array.isArray(ops)) ops = [ops];
  const f0 = ops[0] || {};
  return {
    nOrden: f0.num_orden || ('ODP-' + (f0.numero_factura||f0.num_op||'')),
    dealer: f0.nombre_dealer || '',
    num_op: ops.map(o=>o.num_op).join(', '),
    financiera: f0.financiera || 'Autofin',
    numero_factura: f0.numero_factura || '',
    fecha_factura: fechaCL(f0.fecha_factura),
    fecha_recepcion: fechaCL(f0.fac_recepcion),
    doc: f0.es_boleta ? 'boleta' : 'factura',
  };
}
function bloque(tpl, vals){
  let t = escH(String(tpl||'').trim());
  for (const k in vals) t = t.split('{'+k+'}').join('<strong>'+escH(vals[k])+'</strong>');
  const P = 'font-size:14px;color:#374151;margin:0 0 14px;line-height:1.6';
  return t.split(/\n\s*\n/).map(par => `<p style="${P}">${par.replace(/\n/g,'<br>')}</p>`).join('');
}
function asuntoDe(ops){ let s = String(CORREO.asunto||''); const v = valsDe(ops); for (const k in v) s = s.split('{'+k+'}').join(v[k]); return s; }

async function cargar(){
  try {
    const [r, ri, rc] = await Promise.all([
      fetch('/api/postventa/orden-pago-comision', { headers: hdr() }),
      fetch('/api/impuestos/valores', { headers: hdr() }),
      fetch('/api/postventa/config', { headers: hdr() })
    ]);
    const j = await r.json();
    if (!j.success) throw new Error(j.error);
    try { const ji = await ri.json(); if (ji.success && ji.data) IMPUESTOS = ji.data; } catch(e){}
    try { const jc = await rc.json(); if (jc.success && jc.data && jc.data.correo_orden_comision) CORREO = { ...CORREO, ...jc.data.correo_orden_comision }; } catch(_){}
    if (CORREO.activo === false) { const b=document.getElementById('btnEnviar'); if(b){ b.style.display='none'; } }
    DATA = j.data.rows || [];
    render();
  } catch(e){ document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="vacio">Error: ${e.message}</td></tr>`; }
}

// Agrupa operaciones que comparten la MISMA boleta/factura del mismo dealer
// → una sola orden de pago. Sin número de factura quedan individuales.
let GROUPS = [];
function agrupar(rows){
  const map = new Map();
  for (const r of rows){
    const key = r.numero_factura
      ? ((r.rut_dealer||'')+'|'+r.numero_factura+'|'+(r.es_boleta?'B':'F'))
      : ('op'+r.id);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  }
  return [...map.values()];
}
function render(){
  const q = (document.getElementById('buscar').value||'').toLowerCase();
  const rows = DATA.filter(r => !q || [r.num_op,r.nombre_dealer,r.rut_dealer,r.financiera,r.numero_factura].some(v => String(v||'').toLowerCase().includes(q)));
  GROUPS = agrupar(rows);
  const total = rows.reduce((s,r)=>s+(Number(r.comision)||0),0);
  document.getElementById('resumen').textContent = `${rows.length} operación(es) en ${GROUPS.length} orden(es) · Comisión total: ${fmt(total)}`;
  const tb = document.getElementById('tbody');
  if (!GROUPS.length){ tb.innerHTML = '<tr><td colspan="8" class="vacio">No hay operaciones con factura recibida pendientes de emitir.</td></tr>'; return; }
  tb.innerHTML = GROUPS.map((g, gi) => {
    const f0 = g[0];
    const sumCom = g.reduce((s,o)=>s+(Number(o.comision)||0),0);
    const dias = Math.max(...g.map(o=>o.dias!=null?o.dias:-1));
    const dc = dias>=7?'alto':dias>=3?'medio':'';
    const nums = g.map(o=>o.num_op).join(', ');
    const fins = [...new Set(g.map(o=>o.financiera))].map(f=>`<span class="pill">${f||'—'}</span>`).join(' ');
    const fact = f0.numero_factura
      ? `<b>${f0.numero_factura}</b> <span class="pill">${f0.es_boleta?'Boleta':'Factura'}</span>${g.length>1?` · ${g.length} ops`:''}`
      : '—';
    return `<tr>
      <td><b>${nums}</b></td>
      <td>${fins}</td>
      <td>${f0.nombre_dealer||'—'}</td>
      <td>${f0.rut_dealer||'—'}</td>
      <td style="text-align:right">${fmt(sumCom)}</td>
      <td style="font-size:.8rem">${fact}</td>
      <td><span class="dias ${dc}">${dias>=0?dias+' d':'—'}</span></td>
      <td><button class="btn-ver" onclick="verOrden(${gi})"><i class="bi bi-eye me-1"></i>Ver orden</button>
        <button class="btn-ver" style="background:#fff;color:#0141A2;border:1px solid #bfdbfe" onclick="subirFacturaDoc(${f0.id})" title="Adjuntar el PDF de la factura: viaja en el correo de la ODP a Contabilidad y queda de respaldo"><i class="bi bi-paperclip"></i><span id="facN${f0.id}"></span></button></td>
    </tr>`;
  }).join('');
}

/* ── Adjuntar la factura (PDF) del grupo: respaldo + adjunto del correo a Finanzas ── */
async function subirFacturaDoc(idSeg){
  try {
    const r = await fetch('/api/postventa/factura-doc?origen=COMISION&ref_id='+idSeg, { headers: hdr() });
    const j = await r.json();
    const ya = (j.success && j.data && j.data.length) ? '\n\nYa adjuntas:\n' + j.data.map(d=>'· '+d.nombre).join('\n') : '';
    if (!confirm('Adjuntar la factura de este grupo.'+ya+'\n\n¿Elegir archivo?')) return;
  } catch(_){}
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.pdf,.jpg,.jpeg,.png,.xml';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 7*1024*1024) return alert("Máximo 7 MB");
    const b64 = await new Promise((ok,ko)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(',')[1]); fr.onerror=ko; fr.readAsDataURL(f); });
    try {
      const r = await fetch('/api/postventa/factura-doc', { method:'POST', headers:hdr(),
        body: JSON.stringify({ origen:'COMISION', ref_id:idSeg, nombre:f.name, mime:f.type, base64:b64 }) });
      const j = await r.json();
      if (!j.success) return alert(j.error||'Error al subir');
      const n = document.getElementById('facN'+idSeg); if (n) n.textContent=' ✓';
      alert('Factura "'+f.name+'" adjuntada: viajará en el correo de la ODP a Contabilidad y queda de respaldo.');
    } catch(_){ alert('Error de conexión'); }
  };
  inp.click();
}

// ops = array de operaciones que comparten la misma factura/cartola.
// La factura es por el TOTAL de la cartola (mismo monto en cada operación) → se toma UNA vez.
// El total se reparte entre las comisiones de las operaciones cargadas (deben cuadrar).
function docHTML(ops){
  if (!Array.isArray(ops)) ops = [ops];
  /* Los montos de la factura viven en la TITULAR del grupo (una factura por cartola).
     El servidor ya se los copia a las réplicas, pero acá se elige además la op que
     TRAE el desglose, sin depender del orden de carga: con la primera op cargada
     siendo una réplica sin montos, la orden caía a su comisión y acusaba un
     descuadre fantasma (Omar Vasconcello, 3 ops, 04-09-2026). */
  const f0 = ops.find(o => o.monto_liquido != null) || ops.find(o => !Number(o.es_replica)) || ops[0];
  const iva = Number(IMPUESTOS.IVA)||19, ret = Number(IMPUESTOS.RETENCION_HONORARIOS)||15.25;
  const esBoleta = !!f0.es_boleta;
  const pct0 = (f0.impuesto_pct != null) ? Number(f0.impuesto_pct) : (esBoleta ? ret : iva);
  const impLbl = `${esBoleta ? 'Retención' : 'IVA'} ${pct0}%`;
  /* Factura (total de la cartola) — UNA sola vez desde f0.
     OJO: la comisión del sistema es BRUTA (IVA INCLUIDO).
     El desglose neto/impuesto SOLO es confiable cuando se capturó al registrar la
     factura (modal de Seguimiento graba impuesto_monto y monto_liquido). Si ese
     desglose NO existe —no hay factura aún, o la fila la creó la carga masiva
     volcando la comisión bruta en monto_bruto— el monto disponible es el BRUTO y
     el neto se DESAGREGA (bruto ÷ 1,19). Nunca se le suma IVA encima: eso inflaba
     la orden un 19% y disparaba un descuadre fantasma contra la cartola. */
  const sinDesglose  = (f0.impuesto_monto == null || f0.monto_liquido == null);
  // Sin desglose capturado → se desagrega la comisión BRUTA con el motor único
  const _dg = sinDesglose ? AF_IMPUESTO.desglosar(Number(f0.monto_factura ?? f0.comision)||0, pct0, esBoleta) : null;
  const facturaNeto  = _dg ? _dg.base     : (Number(f0.monto_factura ?? f0.comision)||0);
  const facturaImp   = _dg ? _dg.impuesto : Number(f0.impuesto_monto);
  const facturaPagar = _dg ? _dg.liquido  : Number(f0.monto_liquido);
  // Comisiones de las operaciones cargadas (de la carta) → son BRUTAS (IVA incluido) y
  // deben sumar el bruto de la factura. La BOLETA va por el NETO de la factura
  // equivalente (regla de negocio), así que para cuadrar contra las comisiones brutas
  // hay que reponerle el IVA — comparar el bruto de la boleta directo acusaba una
  // "diferencia" fantasma del 19% en toda boleta (op 88986, 25-08-2026).
  const facturaBruto = esBoleta ? Math.round(facturaNeto * (1 + iva/100)) : facturaPagar;
  const sumComision = ops.reduce((s,o)=>s+(Number(o.comision)||0),0);
  const cuadra = Math.abs(sumComision - facturaBruto) <= 1;   // tolerancia de redondeo
  const fechaPago = fechaCL(new Date().toISOString());
  const nums = ops.map(o=>o.num_op).join(', ');
  const conceptoDet = `Comisión OP${ops.length>1?'s':''} ${nums} - ${f0.financiera||''}`;
  const nOrden = f0.num_orden || ('ODP-'+(f0.numero_factura||f0.num_op||''));
  const Sdoc = 'font-family:Arial,sans-serif;color:#1e293b;font-size:11px;border:2px solid #93c5fd;border-radius:8px;padding:14px 16px;display:block;width:100%;box-sizing:border-box';
  const Smeta = 'border-collapse:collapse;font-size:11px';
  const Slbl = 'color:#64748b;font-weight:700;text-transform:uppercase;font-size:9px;padding:1px 8px;white-space:nowrap';
  const Smv = 'padding:1px 8px;font-size:11px';
  const Stbl = 'width:100%;border-collapse:collapse;margin:8px 0;font-size:11px;table-layout:fixed';
  const Sth = 'background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd;padding:5px 6px;font-size:9px;text-transform:uppercase;text-align:left;white-space:normal;word-break:break-word';
  const Std = 'border:1px solid #cbd5e1;padding:5px 6px;white-space:normal;word-break:break-word';
  const Snum = Std + ';text-align:right';
  const Sres = 'border-collapse:collapse;margin-top:14px;max-width:430px';
  const SresL = 'border:1px solid #cbd5e1;padding:5px 8px;font-size:11px;background:#eff6ff;font-weight:700;width:42%';
  const SresV = 'border:1px solid #cbd5e1;padding:5px 8px;font-size:11px';
  const filas = ops.map(o=>{
    const concepto = `Comisión OP ${o.num_op||''} - ${o.financiera||''}`;
    return `<tr>
      <td style="${Std}">${o.nombre_dealer||''}</td><td style="${Std}">${o.rut_dealer||''}</td>
      <td style="${Std}">${concepto}</td><td style="${Std}">${periodoCL(o.fecha_factura)}</td><td style="${Snum}">${fmt(Number(o.comision)||0)}</td>
    </tr>`;
  }).join('');
  const aviso = cuadra ? '' : `<div style="margin:10px 0;padding:9px 12px;border:1.5px solid #fca5a5;background:#fef2f2;color:#b91c1c;border-radius:7px;font-size:11px;font-weight:800;line-height:1.45">
      ⚠ ORDEN DE PAGO NO CUADRA CON FACTURA Y CARTOLA. La comisión de las operaciones cargadas suman ${fmt(sumComision)}, y la factura es por ${fmt(facturaBruto)} (diferencia ${fmt(Math.abs(sumComision-facturaBruto))}). Cargue todas las operaciones de la cartola antes de emitir.</div>`;
  return `<div style="${Sdoc}">
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px"><tbody><tr>
      <td style="vertical-align:top">
        <table style="${Smeta}"><tbody>
          <tr><td style="${Slbl}">Concepto</td><td style="${Smv}">SOLICITUD DE PAGO</td></tr>
          <tr><td style="${Slbl}">Compañía</td><td style="${Smv}">AUTOFÁCIL SPA</td></tr>
          <tr><td style="${Slbl}">Tipo gasto</td><td style="${Smv}">COMISIÓN A DEALER</td></tr>
          <tr><td style="${Slbl}">N° Orden</td><td style="${Smv}">${nOrden}</td></tr>
          <tr><td style="${Slbl}">Fecha</td><td style="${Smv}">${fechaPago}</td></tr>
        </tbody></table>
      </td>
      <td style="vertical-align:top;text-align:right">
        <img width="150" height="34" style="height:34px;width:auto" src="${location.origin}/img/logo-autofacil.png" onerror="this.src='${location.origin}/img/logo.png'">
      </td>
    </tr></tbody></table>
    <table style="${Stbl}">
      <colgroup><col style="width:30%"><col style="width:15%"><col style="width:33%"><col style="width:10%"><col style="width:12%"></colgroup>
      <thead><tr><th style="${Sth}">Dealer</th><th style="${Sth}">RUT</th><th style="${Sth}">Detalle</th><th style="${Sth}">Mes</th><th style="${Sth}">Comisión</th></tr></thead>
      <tbody>${filas}
        <tr><td colspan="4" style="${Std};text-align:right;font-weight:800;background:#f1f5f9">TOTAL COMISIONES (${ops.length} op${ops.length>1?'s':''})</td><td style="${Snum};font-weight:800;background:${cuadra?'#f1f5f9':'#fee2e2'};color:${cuadra?'#0f172a':'#b91c1c'}">${fmt(sumComision)}</td></tr>
      </tbody>
    </table>
    ${aviso}
    <table style="${Sres}"><tbody>
      <tr><td style="${SresL}">Proveedor</td><td style="${SresV}">${f0.nombre_dealer||''}</td></tr>
      <tr><td style="${SresL}">Concepto</td><td style="${SresV}">${conceptoDet}</td></tr>
      <tr><td style="${SresL}">Período</td><td style="${SresV}">${periodoCL(f0.fecha_factura)}</td></tr>
      ${f0.numero_factura?`<tr><td style="${SresL}">N° ${esBoleta?'Boleta':'Factura'}</td><td style="${SresV}">${f0.numero_factura}${esBoleta?' (Boleta)':''}${f0.es_terceros?' · terceros':''}${ops.length>1?` · ${ops.length} operaciones`:''}</td></tr>`:''}
      <tr><td style="${SresL}">Depositar en</td><td style="${SresV}">${f0.num_cuenta? `<b>${f0.banco||''}</b> · ${f0.tipo_cuenta||'Cuenta Corriente'} · Cta. N° <b>${f0.num_cuenta}</b>` : '—'}</td></tr>
      <tr><td style="${SresL}">Titular</td><td style="${SresV}">${f0.nombre_cuenta||f0.nombre_dealer||'—'}${(f0.rut_pago||f0.rut_dealer)?' · RUT '+(f0.rut_pago||f0.rut_dealer):''}</td></tr>
      <tr><td style="${SresL}">Comisión neta${esBoleta?' (bruto de la boleta)':''}</td><td style="${SresV}">${fmt(facturaNeto)}</td></tr>
      <tr><td style="${SresL}">${esBoleta && !facturaImp ? 'Retención — la paga el emisor' : impLbl}${esBoleta && facturaImp ? ' — se descuenta' : (!esBoleta ? ' — crédito fiscal AutoFácil' : '')}</td><td style="${SresV}">${esBoleta && facturaImp ? '− ' : ''}${fmt(facturaImp)}</td></tr>
      <tr><td style="${SresL}">A pagar</td><td style="${SresV};font-weight:700">${fmt(facturaPagar)}</td></tr>
      <tr><td style="${SresL}">Fecha a pagar</td><td style="${SresV}">${fechaPago}</td></tr>
    </tbody></table>
  </div>`;
}

function emailHTML(ops){
  if (!Array.isArray(ops)) ops = [ops];
  const vals = valsDe(ops);
  return `<div style="font-family:Arial,sans-serif">
    ${bloque(CORREO.cuerpo, vals)}
    ${docHTML(ops)}
    <div style="margin-top:18px">${bloque(CORREO.firma, vals)}</div>
  </div>`;
}

async function verOrden(gi){
  actual = GROUPS[gi];
  if (!actual || !actual.length) return;
  const f0 = actual[0];
  if (!f0.num_orden){
    // Solo lectura: el N° se ASIGNA al emitir. Sin número aún, el borrador
    // muestra "POR ASIGNAR" y emitir() lo reemplaza por el real antes del correo.
    try {
      const r = await fetch('/api/postventa/orden-pago-comision/'+f0.id+'/correlativo', { headers: hdr() });
      const j = await r.json();
      actual.forEach(o => o.num_orden = (j.success && j.data.num_orden) || 'POR ASIGNAR');
    } catch(e){ actual.forEach(o => o.num_orden = o.num_orden || 'POR ASIGNAR'); }
  }
  // PRE-EMISIÓN: hacer notar los datos que faltan antes de emitir (motor AF_ODP_PRE)
  let facturaAdj = '';
  try {
    const rd = await fetch('/api/postventa/factura-doc?origen=COMISION&ref_id='+f0.id, { headers: hdr() });
    const jd = await rd.json();
    if (jd.success && jd.data && jd.data.length) facturaAdj = jd.data.map(d=>d.nombre).join(', ');
  } catch(_){}
  const faltas = AF_ODP_PRE.check([
    { etiqueta:'RUT del dealer', valor: f0.rut_dealer, critico:true },
    { etiqueta:'N° de cuenta del dealer (dato de transferencia)', valor: f0.num_cuenta, critico:true },
    { etiqueta:'Banco del dealer (dato de transferencia)', valor: f0.banco, critico:true },
    { etiqueta:'N° de factura/boleta', valor: f0.numero_factura },
    { etiqueta:'Factura adjunta (PDF, viaja a Contabilidad)', valor: facturaAdj },
  ]);
  /* Los avisos van en su propio contenedor: docWrap es el CUERPO del correo
     a Contabilidad y no debe llevar el recuadro de faltas. */
  document.getElementById('preAvisos').innerHTML = AF_ODP_PRE.render(faltas);
  document.getElementById('docWrap').innerHTML = emailHTML(actual);
  document.getElementById('ov').classList.add('open');
}
function cerrar(){ document.getElementById('ov').classList.remove('open'); actual=null; }

/* El botón "Enviar Correo" se eliminó (v2.13): emitir() ya manda el correo
   automáticamente a Contabilidad — dos botones confundían y duplicaban envíos. */
async function emitir(){
  if (!actual || !actual.length) return;
  const ids = actual.map(o => o.id);
  const nums = actual.map(o => o.num_op).join(', ');
  if (!confirm(`¿Emitir la orden de pago de comisión de la${ids.length>1?'s':''} OP ${nums}? Pasará${ids.length>1?'n':''} a Comisiones a Pagar y el correo saldrá a Contabilidad.`)) return;
  // Correo AUTOMÁTICO con la emisión (mismo fix que la orden de saldo: eran dos
  // botones y las órdenes salían emitidas sin que Contabilidad se enterara).
  let htmlDoc = document.getElementById('docWrap').innerHTML, asu = asuntoDe(actual);
  try {
    const r = await fetch('/api/postventa/orden-pago-comision/emitir', { method:'POST', headers:hdr(), body:JSON.stringify({ ids }) });
    const j = await r.json();
    if (!j.success) throw new Error(j.error);
    // El N° real nace al emitir: reemplazar el borrador en el correo
    if (j.data && j.data.num_orden) { htmlDoc = htmlDoc.split('POR ASIGNAR').join(j.data.num_orden); asu = asu.split('POR ASIGNAR').join(j.data.num_orden); }
    DATA = DATA.filter(x => !ids.includes(x.id));
    cerrar(); render();
    let notaCorreo = '';
    if (typeof CORREO === 'undefined' || CORREO.activo !== false) {
      try {
        const rc = await fetch('/api/postventa/enviar-correo-orden', { method:'POST', headers:hdr(),
          body: JSON.stringify({ asunto: asu, html: htmlDoc, num_op: nums, tipo:'comision' }) });
        const jc = await rc.json();
        notaCorreo = jc.success ? ' y correo enviado a ' + (jc.data?.to||'Contabilidad') : ' — ⚠ el correo NO salió: ' + (jc.error||'');
      } catch(e){ notaCorreo = ' — ⚠ el correo NO salió: ' + e.message; }
    }
    toast(`Orden emitida — ${ids.length} operación(es)` + notaCorreo);
  } catch(e){ toast('Error: '+e.message); }
}

document.getElementById('ov').addEventListener('click', e => { if (e.target.id==='ov') cerrar(); });

let CAN_EMITIR = false;
(async function permEmitir(){
  try {
    const admin = (yo.perfil||'') === 'Administrador';
    const [rp, ra] = await Promise.all([
      fetch('/api/auth/mis-permisos', { headers:hdr() }).then(r=>r.json()).catch(()=>({})),
      fetch('/api/postventa/atribuciones-comision', { headers:hdr() }).then(r=>r.json()).catch(()=>({})),
    ]);
    CAN_EMITIR = admin || (rp.funcionalidades||[]).includes('pv_com_orden_emitir');
    const btn = document.querySelector('.btn-emitir');
    if (btn && !CAN_EMITIR){
      btn.style.display = 'none';
      const quienes = ((ra.data && ra.data.pv_com_orden_emitir) || []).filter(p=>p!=='Administrador');
      const foot = btn.parentElement;
      const n = document.createElement('span');
      n.style.cssText = 'font-size:.78rem;color:#94a3b8;align-self:center';
      n.textContent = 'Solo pueden emitir: ' + [...new Set([...quienes,'Administrador'])].join(', ');
      foot.appendChild(n);
    }
  } catch(e){}
})();

cargar();
