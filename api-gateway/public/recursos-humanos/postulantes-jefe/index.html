<!DOCTYPE html>
<!-- v1.0 — Revision de Postulantes (Jefatura): el jefe directo revisa los candidatos de sus avisos y marca los que quiere que RRHH siga trabajando (dispara DealerNet) -->
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de Postulantes — AutoFácil</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link href="/css/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --navy:#0141A2; --navy-dark:#012d70; --accent:#009AFE; --bg:#f0f4f8; }
  * { box-sizing:border-box; } body { background:var(--bg); font-family:'Segoe UI',system-ui,sans-serif; margin:0; color:#1e293b; }
  .page { padding:24px 28px 80px; }
  .banner { background:linear-gradient(135deg,#012d70,#0141A2 50%,#009AFE); border-radius:16px; color:#fff; padding:20px 28px; margin-bottom:16px; display:flex; align-items:center; gap:18px; }
  .banner i { font-size:2.2rem; opacity:.85; } .banner h2 { margin:0 0 3px; font-size:1.25rem; } .banner p { margin:0; opacity:.85; font-size:.86rem; }
  .avisos-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .av-chip { background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:8px 16px; font-weight:700; font-size:.85rem; color:#475569; cursor:pointer; }
  .av-chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:14px; }
  .cand { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
  .cand.marcado { outline:2.5px solid #15803d; }
  .cand h4 { margin:0; font-size:1rem; color:var(--navy-dark); }
  .stars { color:#f59e0b; letter-spacing:1px; font-size:.95rem; }
  .noapto { display:inline-block; background:#fee2e2; color:#991b1b; font-size:.64rem; font-weight:800; border-radius:8px; padding:1px 8px; }
  .meta { font-size:.8rem; color:#64748b; }
  .resumen { font-size:.82rem; color:#475569; background:#f8fafc; border-radius:9px; padding:8px 10px; }
  .pill { font-size:.66rem; font-weight:800; border-radius:12px; padding:2px 10px; }
  .p-NUEVA { background:#dbeafe; color:#1e40af; } .p-otros { background:#f1f5f9; color:#475569; } .p-DESCARTADA { background:#fee2e2; color:#991b1b; } .p-CONTRATADA { background:#dcfce7; color:#166534; }
  .btn { border:none; border-radius:9px; padding:8px 14px; font-size:.82rem; font-weight:700; cursor:pointer; }
  .btn-verde { background:#15803d; color:#fff; } .btn-line { background:#fff; border:1.5px solid #e2e8f0; color:#334155; }
  .acciones { display:flex; gap:8px; margin-top:auto; padding-top:8px; }
  .marcado-band { background:#dcfce7; color:#166534; font-size:.76rem; font-weight:800; border-radius:9px; padding:5px 10px; text-align:center; }
  .empty { text-align:center; color:#94a3b8; padding:60px 0; grid-column:1/-1; }
  dialog { border:none; border-radius:14px; padding:0; max-width:760px; width:96%; box-shadow:0 36px 90px rgba(2,6,23,.55), 0 10px 26px rgba(2,6,23,.34); }
  dialog::backdrop { background:rgba(15,23,42,.32); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .dlg-head { background:linear-gradient(135deg,#012d70,#0255c5); color:#fff; padding:14px 20px; font-weight:800; display:flex; justify-content:space-between; align-items:center; }
  .dlg-body { padding:18px 20px; max-height:72vh; overflow:auto; }
  .dlg-foot { padding:12px 20px; border-top:1px solid #eef2f7; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:3px 12px; font-size:.87rem; }
  .kv b { color:#64748b; font-size:.72rem; text-transform:uppercase; padding-top:2px; }
  .sec { font-size:.76rem; font-weight:800; text-transform:uppercase; color:var(--navy); margin:14px 0 6px; border-bottom:2px solid #eff6ff; padding-bottom:3px; }
  .reqbar { display:flex; align-items:center; gap:8px; font-size:.84rem; padding:3px 0; }
  .reqbar .b { flex:0 0 150px; height:8px; background:#e5e9f0; border-radius:5px; overflow:hidden; }
  .reqbar .f { height:100%; background:linear-gradient(90deg,#0141A2,#009AFE); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#15803d; color:#fff; border-radius:10px; padding:11px 24px; font-weight:700; display:none; z-index:999; }
</style>
</head>
<body>
<div id="af-topnav"></div>
<script>window.AF_TOPNAV={breadcrumb:[{label:'Inicio',href:'/'},{label:'Recursos Humanos',href:'/recursos-humanos/'},{label:'Revisión de Postulantes',icon:'bi-person-check',current:true}]};</script>

<div class="page">
  <div class="banner"><i class="bi bi-person-check"></i><div>
    <h2>Revisión de Postulantes — Jefatura</h2>
    <p>Los candidatos de los cargos que solicitaste. Marca con ✓ los que te interesan: eso avisa a RRHH y solicita automáticamente los informes DealerNet.</p>
  </div></div>
  <div class="avisos-bar" id="avBar"></div>
  <div class="grid" id="grid"><div class="empty">Cargando…</div></div>
</div>

<dialog id="dlgFicha">
  <div class="dlg-head"><span id="fTit">Ficha</span><button class="btn btn-line" onclick="dlgFicha.close()">✕</button></div>
  <div class="dlg-body" id="fBody"></div>
  <div class="dlg-foot" id="fFoot"></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="/js/auth-guard.js"></script>
<script>
'use strict';
const token = sessionStorage.getItem('token');
if (!token) location.href = '/login.html';
const H = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtF = f => f ? new Date(f).toLocaleDateString('es-CL') : '—';
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3200); }

let DATA = { avisos: [], postulantes: [] }, AV_SEL = null;

// Guardia de permiso
(async () => { try {
  const j = await (await fetch('/api/auth/mis-permisos', { headers: H })).json();
  const f = j.funcionalidades || [];
  const admin = (JSON.parse(sessionStorage.getItem('usuario')||'{}').perfil === 'Administrador');
  if (!admin && !f.includes('rh_postulaciones_jefe') && !f.includes('rh_postulaciones')) location.replace('/');
} catch (_) {} })();

const starsHTML = (e, apto) => {
  if (e == null) return '<span style="color:#94a3b8;font-size:.8rem">sin evaluación</span>';
  const full = Math.floor(e), half = e % 1 >= 0.5;
  return `<span class="stars" title="${String(e).replace('.',',')} de 5">${'★'.repeat(full)}${half?'½':''}${'☆'.repeat(5-full-(half?1:0))}</span>`
    + (apto === 0 ? ' <span class="noapto">NO APTO</span>' : '');
};
const nivelTop = p => {
  const orden = ['Postgrado','Universitario','Técnico','Media','Básica','Curso'];
  for (const n of orden) if ((p.estudios||[]).some(e => e.nivel === n)) return n;
  return null;
};

async function cargar(){
  const j = await (await fetch('/api/postulaciones/jefe/postulantes', { headers: H })).json();
  if (!j.success) return toast(j.error || 'Error');
  DATA = j.data;
  if (!DATA.avisos.length) {
    $('avBar').innerHTML = '';
    $('grid').innerHTML = '<div class="empty">No tienes cargos solicitados a tu nombre.<br><span style="font-size:.85rem">Pide a RRHH que te asigne como jefe directo en el aviso.</span></div>';
    return;
  }
  if (AV_SEL == null || !DATA.avisos.some(a => a.id === AV_SEL)) AV_SEL = DATA.avisos[0].id;
  $('avBar').innerHTML = DATA.avisos.map(a =>
    `<div class="av-chip ${a.id===AV_SEL?'on':''}" onclick="AV_SEL=${a.id};pintar();pintarBar()">${esc(a.titulo)} (${a.postulantes})</div>`).join('');
  pintar();
}
function pintarBar(){
  document.querySelectorAll('.av-chip').forEach((c, i) => c.classList.toggle('on', DATA.avisos[i].id === AV_SEL));
}
function pintar(){
  const rows = DATA.postulantes.filter(p => p.id_aviso === AV_SEL);
  $('grid').innerHTML = rows.length ? rows.map(p => {
    const t0 = (p.trabajos||[])[0];
    const edad = p.fecha_nacimiento ? Math.floor((Date.now() - new Date(p.fecha_nacimiento)) / 3.15576e10) + ' años' : null;
    return `<div class="cand ${p.jefe_marca ? 'marcado' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <h4>${esc(p.nombre)}</h4>
        <span class="pill ${p.estado==='NUEVA'?'p-NUEVA':p.estado==='DESCARTADA'?'p-DESCARTADA':p.estado==='CONTRATADA'?'p-CONTRATADA':'p-otros'}">${esc(p.estado)}</span>
      </div>
      <div>${starsHTML(p.estrellas, p.apto)}${p.cumplimiento != null ? ` <span class="meta">· ${p.cumplimiento}% requisitos</span>` : ''}</div>
      <div class="meta">${[esc(p.comuna||''), edad, nivelTop(p) ? '🎓 ' + nivelTop(p) : null, p.pretension_renta ? '💰 ' + esc(p.pretension_renta) : null].filter(Boolean).join(' · ') || '—'}</div>
      ${t0 ? `<div class="meta">💼 ${esc((t0.cargo||'') + (t0.empresa ? ' · ' + t0.empresa : ''))}</div>` : ''}
      ${p.resumen_ia ? `<div class="resumen">${esc(p.resumen_ia)}</div>` : ''}
      ${p.jefe_marca ? `<div class="marcado-band">✓ Enviado a RRHH — DealerNet solicitado</div>` : ''}
      <div class="acciones">
        <button class="btn btn-line" onclick="abrirFicha(${p.id})"><i class="bi bi-eye me-1"></i>Ver ficha</button>
        ${p.jefe_marca
          ? `<button class="btn btn-line" onclick="marcar(${p.id}, 0)">Quitar marca</button>`
          : `<button class="btn btn-verde" style="flex:1" onclick="marcar(${p.id}, 1, '${esc(p.nombre).replace(/'/g,'')}')"><i class="bi bi-check-lg me-1"></i>Me interesa — que RRHH avance</button>`}
      </div>
    </div>`;
  }).join('') : '<div class="empty">Este aviso aún no tiene postulantes.</div>';
}

async function marcar(id, valor, nombre){
  let nota = '';
  if (valor) {
    if (!confirm(`¿Marcar a ${nombre} para que RRHH siga el proceso?\n\nSe solicitarán automáticamente sus informes DealerNet.`)) return;
    nota = prompt('Comentario para RRHH (opcional):') || '';
  }
  const j = await (await fetch('/api/postulaciones/jefe/postulantes/' + id + '/marcar', {
    method:'POST', headers: H, body: JSON.stringify({ marcar: valor, nota }) })).json();
  if (!j.success) return toast(j.error || 'Error');
  toast(valor ? (j.data.dealernet === 'sin_rut' ? 'Marcado — sin RUT para DealerNet, RRHH lo pedirá' : 'Marcado — RRHH avisado y DealerNet solicitado') : 'Marca retirada');
  cargar();
}

async function abrirFicha(id){
  const j = await (await fetch('/api/postulaciones/jefe/postulantes/' + id, { headers: H })).json();
  if (!j.success) return toast(j.error || 'Error');
  const p = j.data;
  $('fTit').textContent = p.nombre + ' — ' + p.aviso;
  const edad = p.fecha_nacimiento ? Math.floor((Date.now() - new Date(p.fecha_nacimiento)) / 3.15576e10) + ' años' : '—';
  const pj = p.puntaje || {};
  $('fBody').innerHTML = `
    <div class="kv">
      <b>Edad</b><span>${edad}</span>
      <b>Comuna</b><span>${esc(p.comuna||'—')}</span>
      <b>Pretensión</b><span>${esc(p.pretension_renta||'—')}</span>
      <b>Postuló</b><span>${fmtF(p.created_at)}</span>
    </div>
    <div class="sec">Evaluación ${starsHTML(p.estrellas, p.apto)} ${pj.pct != null ? `<span style="color:#64748b;font-weight:400;text-transform:none">(${pj.pct}%)</span>` : ''}</div>
    ${(pj.excluyentes||[]).length ? `<p style="font-size:.84rem;color:#b91c1c;font-weight:700">⛔ No cumple: ${pj.excluyentes.map(esc).join(' · ')}</p>` : ''}
    ${(pj.detalle||[]).filter(d => d.pct != null).map(d => `<div class="reqbar"><span style="flex:1">${esc(d.texto)}</span><div class="b"><div class="f" style="width:${d.pct}%"></div></div><b style="width:44px;text-align:right">${d.pct}%</b></div>`).join('')}
    ${p.resumen_ia ? `<div class="sec">Resumen (IA)</div><p style="font-size:.88rem">${esc(p.resumen_ia)}</p>` : ''}
    <div class="sec">Estudios</div>
    ${(p.estudios||[]).map(e => `<div style="font-size:.87rem;padding:2px 0">🎓 <b>${esc(e.nivel||'')}</b> ${esc(e.titulo||'')} — ${esc(e.institucion||'')} <span style="color:#94a3b8">${esc(e.estado||'')}</span></div>`).join('') || '—'}
    <div class="sec">Experiencia</div>
    ${(p.trabajos||[]).map(t => `<div style="font-size:.87rem;padding:3px 0">💼 <b>${esc(t.cargo||'')}</b> · ${esc(t.empresa||'')} <span style="color:#94a3b8">${esc(t.desde||'')}${t.hasta?' – '+esc(t.hasta):''}</span>${t.descripcion?`<br><span style="color:#475569;font-size:.8rem">${esc(t.descripcion)}</span>`:''}</div>`).join('') || '—'}
    ${(p.respuestas||[]).length ? `<div class="sec">Sus respuestas</div>` +
      p.respuestas.map(r => `<p style="font-size:.85rem;margin-bottom:8px"><b style="color:#0141A2">${esc(r.pregunta)}</b><br>${esc(r.valor ?? r.respuesta ?? '')}</p>`).join('') : ''}`;
  $('fFoot').innerHTML = `
    <button class="btn btn-line" onclick="verCV(${p.id})"><i class="bi bi-file-earmark-pdf me-1"></i>Ver CV</button>
    <span style="flex:1"></span>
    ${p.jefe_marca ? '<span class="marcado-band">✓ Ya enviado a RRHH</span>'
      : `<button class="btn btn-verde" onclick="dlgFicha.close();marcar(${p.id}, 1, '${esc(p.nombre).replace(/'/g,'')}')"><i class="bi bi-check-lg me-1"></i>Me interesa — que RRHH avance</button>`}`;
  dlgFicha.showModal();
}
async function verCV(id){
  try {
    const r = await fetch('/api/postulaciones/jefe/postulantes/' + id + '/cv', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw 0;
    const u = URL.createObjectURL(await r.blob()); window.open(u, '_blank');
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  } catch (_) { toast('No se pudo abrir el CV'); }
}
cargar();
</script>
<script src="/js/topnav.js"></script>
<script src="/js/app-version.js"></script>
</body>
</html>
